/* ==== css/00-tokens.css ==== */
/* Two token sets and one density scale. Every screen reads these and nothing
   else, so "纸 / 夜" and "紧凑 / 舒适" stay pure token swaps — the layout is
   identical under all four combinations. Stage screens set data-theme="night"
   on their own root regardless of the desk theme: on stage a bright surface
   lands on the presenter's face and ruins their night vision. */
:root {
  --paper:#FAF7F2; --paper-2:#F2EDE4; --card:#FFFDFA; --card-2:#F7F3EB;
  --ink:#221E19; --ink-2:#5C544A; --ink-3:#8C8375; --ink-4:#B7AE9F;
  --rule:#DDD4C5; --rule-soft:#EAE3D7;
  --go:#17804F; --tight:#C08717; --over:#B33121;
  --go-bg:#E4EFE8; --tight-bg:#F7EFDB; --over-bg:#F7E6E1;
  --go-bd:#B4CFC0; --tight-bd:#E2C68B; --over-bd:#DFB0A5;
  --wash:#F3E7CB;
  --chip:#35566E; --chip-bg:#E8EEF3; --chip-bd:#C7D6E0;
  --sel:#F1EEE7;

  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --read:"Newsreader",Georgia,"Songti SC","Noto Serif CJK SC",serif;
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;

  /* density scale — the only thing 紧凑 / 舒适 moves */
  --fs-ui:14px;   --lh-ui:1.55;
  --fs-script:16px; --lh-script:1.78;  --gap-script:14px;
  --fs-say:13.5px;  --lh-say:1.6;
  --fs-lead:13.5px;
  --pad-cue:12px;  --cue-rule:1px;
  --pad-beat:8px 14px 9px 11px;
  --radius:4px;
}
[data-density="roomy"] {
  --fs-ui:15px;   --lh-ui:1.7;
  --fs-script:17.5px; --lh-script:1.95; --gap-script:19px;
  --fs-say:15px;    --lh-say:1.7;
  --fs-lead:15px;
  --pad-cue:17px;  --cue-rule:0px;
  --pad-beat:13px 14px 14px 11px;
  --radius:6px;
}
[data-theme="night"] {
  --paper:#17130E; --paper-2:#110E0A; --card:#201B15; --card-2:#1A1610;
  --ink:#EFE8DB; --ink-2:#B0A594; --ink-3:#80766A; --ink-4:#584F45;
  --rule:#352F29; --rule-soft:#292420;
  --go:#6FBE86; --tight:#E9A93C; --over:#E2634A;
  --go-bg:#16241B; --tight-bg:#2B2113; --over-bg:#2B1914;
  --go-bd:#2E5540; --tight-bd:#6C5527; --over-bd:#6C3B30;
  --wash:#3F3318;
  --chip:#93B6CD; --chip-bg:#1B242A; --chip-bd:#33444E;
  --sel:#262019;
}
/* Stage surfaces: a warmer, deeper black than the night desk, because the
   room is dark and the type is read from two metres away. */
.u-stage {
  --paper:#16130F; --paper-2:#211D17; --card:#2D2820; --card-2:#211D17;
  --ink:#F6F0E5; --ink-2:#A79C8A; --ink-3:#6E6557; --ink-4:#4A4238;
  --rule:#3B342B; --rule-soft:#2A251F;
  --go:#6FBE86; --tight:#E9A93C; --over:#E2634A;
  color-scheme: dark;
}

/* ==== css/01-base.css ==== */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:var(--fs-ui); line-height:var(--lh-ui);
  -webkit-font-smoothing:antialiased; text-wrap:pretty;
}
#app{height:100%}
a{color:var(--over);text-decoration:none}
a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--tight);outline-offset:2px}

.u-lbl{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.u-mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.u-ser{font-family:var(--serif);font-weight:400;letter-spacing:.002em}
.u-read{font-family:var(--read)}
.u-pill{font-family:var(--cond);font-weight:600;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 6px;border:1px solid var(--rule);border-radius:2px;
  display:inline-block;line-height:1.4;color:var(--ink-2);background:var(--card)}
.u-pill--go{color:var(--go);border-color:var(--go-bd);background:var(--go-bg)}
.u-pill--tight{color:var(--tight);border-color:var(--tight-bd);background:var(--tight-bg)}
.u-pill--over{color:var(--over);border-color:var(--over-bd);background:var(--over-bg)}
.u-btn{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;padding:7px 12px;border:1px solid var(--rule);border-radius:3px;
  background:var(--card);color:var(--ink);white-space:nowrap;cursor:pointer}
.u-btn:hover{border-color:var(--ink-3)}
.u-btn--primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.u-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius)}
.u-chip{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--chip);
  background:var(--chip-bg);border:1px solid var(--chip-bd);border-radius:2px;padding:0 4px;line-height:1.5}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ==== css/02-chrome.css ==== */
.u-top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:var(--card);border-bottom:1px solid var(--rule)}
.u-top__brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;
  color:var(--ink);cursor:pointer;font:inherit}
.u-top__rule{width:1px;height:22px;background:var(--rule)}
.u-top__id{display:flex;flex-direction:column;gap:1px;min-width:0}
.u-top__crumb{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.u-top__actions{display:flex;gap:6px}
.u-switches{display:flex;gap:6px}
.u-seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.u-seg__b{padding:6px 10px;border:0;background:var(--card);color:var(--ink-2);cursor:pointer;font:inherit}
.u-seg__b[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.u-top__warn{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.05em;
  padding:6px 11px;border:1px solid var(--over-bd);border-radius:3px;
  background:var(--over-bg);color:var(--over);cursor:pointer}
.u-top__warn:hover{background:var(--over);color:var(--paper)}

/* ==== css/10-editor.css ==== */
/* Editor — one DOM, four evaluations of it. Every colour comes from the token
   set so 纸/夜 costs nothing, and everything that breathes between 紧凑 and
   舒适 is expressed against the density scale rather than restated here.

   The handful of literal sizes below are the micro type the design holds
   still in both densities (time codes, section counters, the 27px budget).
   They live in one block instead of scattered through the rules, so there is
   still exactly one place to change them — 00-tokens.css has no scale for
   type this small and this module may not add one. */
.u-ed {
  --ed-micro:10px;      /* 位置、偏差 */
  --ed-small:10.5px;    /* 时码 */
  --ed-meta:11px;
  --ed-note:12.5px;     /* 旁批与检查说明 */
  --ed-body:13px;
  --ed-nano:9.5px;
  --ed-slide-w:318px;
  --ed-slide-h:112px;
  height:100%;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;
}
.u-ed__body{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr) 300px;min-height:0}

/* ---------- top bar: the number the product exists for ---------- */
.u-ed__pace{display:flex;align-items:baseline;gap:9px;padding-right:4px}
.u-ed__pacebig{font-size:20px;font-weight:600;letter-spacing:-.02em}
.u-ed__pacesub{font-size:var(--ed-small);color:var(--ink-3);white-space:nowrap}

/* ---------- left: running order ---------- */
.u-ed__rail{background:var(--paper-2);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;min-height:0}
.u-ed__railhead{display:flex;align-items:center;gap:8px;padding:14px 14px 9px;flex:0 0 auto}
.u-ed__add{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2)}
.u-ed__add:hover{color:var(--ink)}
.u-ed__list{flex:1;min-height:0;overflow-y:auto}

.u-ed__beat{display:flex;flex-direction:column;gap:calc(var(--pad-cue) / 2);
  width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:none;border:0;border-left:3px solid transparent;padding:var(--pad-beat)}
.u-ed__beat.is-on{background:var(--card);border-left-color:var(--ink);
  box-shadow:0 1px 0 var(--rule-soft),0 -1px 0 var(--rule-soft)}
.u-ed__beat:hover:not(.is-on){background:var(--sel)}
.u-ed__beatline{display:flex;align-items:baseline;gap:8px}
.u-ed__n{font-size:var(--ed-small);color:var(--ink-3);font-weight:500}
.u-ed__beattitle{font-size:calc(var(--fs-ui) - 1px);line-height:calc(var(--lh-ui) - .2);
  flex:1;min-width:0}
.u-ed__beatbudget{font-size:var(--ed-small);color:var(--ink-2)}
.u-ed__meter{display:flex;align-items:center;gap:7px;padding-left:26px}
.u-ed__track{height:3px;flex:1;display:flex;border-radius:2px;overflow:hidden;background:var(--rule-soft)}
.u-ed__fill{height:100%;border-radius:2px}
.u-ed__fill--go{background:var(--go)}
.u-ed__fill--tight{background:var(--tight)}
.u-ed__fill--over{background:var(--over)}
.u-ed__drift{font-size:var(--ed-micro);font-weight:600;color:var(--ink-3)}
.u-ed__drift--tight{color:var(--tight)}
.u-ed__drift--over{color:var(--over)}

.u-ed__appendix{margin:10px 14px 0;padding-top:11px;border-top:1px solid var(--rule);
  display:flex;align-items:baseline;gap:8px}
.u-ed__appendix .u-ed__beattitle{color:var(--ink-2)}

.u-ed__railfoot{flex:0 0 auto;padding:12px 14px 14px;border-top:1px solid var(--rule);
  display:flex;flex-direction:column;gap:5px}
.u-ed__total{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.u-ed__totalv{font-size:12px}
.u-ed__totalv--tight{color:var(--tight);font-weight:600}
.u-ed__totalv--over{color:var(--over);font-weight:600}
/* bound keys print themselves — nothing is reachable and unlisted */
.u-ed__keys{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;padding-top:8px;
  border-top:1px solid var(--rule-soft)}
.u-ed__key{display:flex;align-items:center;gap:5px}
.u-ed__keycap{font-size:var(--ed-micro);color:var(--ink-2);background:var(--card);
  border:1px solid var(--rule);border-radius:2px;padding:0 4px;line-height:1.5}

/* ---------- centre: the spread ---------- */
.u-ed__main{min-width:0;display:flex;flex-direction:column;padding:22px 28px 0;gap:18px;overflow:hidden}
.u-ed__head{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.u-ed__eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.u-ed__where{font-size:var(--ed-meta);color:var(--ink-3)}
.u-ed__bigtitle{font-size:31px;line-height:1.16}
.u-ed__pill--soft{color:var(--ink-2);border-color:var(--rule);background:var(--card-2)}
.u-ed__pill--chip{color:var(--chip);border-color:var(--chip-bd);background:var(--chip-bg)}

.u-ed__band{display:flex;gap:18px;align-items:flex-start;flex:0 0 auto}
.u-ed__slide{width:var(--ed-slide-w);flex:0 0 var(--ed-slide-w);height:var(--ed-slide-h);
  border:1px solid var(--rule);border-radius:3px;background:var(--card);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.u-ed__slide.is-empty{border-style:dashed;background:var(--card-2)}
.u-ed__slidebox{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:10px}
.u-ed__slideref{font-size:var(--ed-meta);color:var(--ink-3)}
.u-ed__slideimg{max-width:100%;max-height:100%;object-fit:contain}
.u-ed__bandmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;padding-top:2px}
.u-ed__metarow{display:flex;flex-direction:column;gap:2px}
.u-ed__metatext{font-size:var(--ed-body);color:var(--ink-2)}
.u-ed__over{color:var(--over)}
.u-ed__bandacts{display:flex;gap:6px;padding-top:2px}

.u-ed__spread{flex:1;display:grid;grid-template-columns:360px minmax(0,1fr);gap:26px;min-height:0}
.u-ed__col{display:flex;flex-direction:column;gap:10px;min-height:0}
.u-ed__colhead{flex:0 0 auto;display:flex;align-items:baseline;gap:8px;
  padding-bottom:7px;border-bottom:1px solid var(--ink)}
.u-ed__col--cue .u-ed__colhead{padding-left:10px;padding-right:10px}
.u-ed__colname{color:var(--ink)}
.u-ed__colnote{font-size:var(--ed-micro);color:var(--ink-3);margin-left:auto}

.u-ed__cuelist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.u-ed__cue{display:flex;flex-direction:column;gap:calc(var(--pad-cue) / 2);
  padding:var(--pad-cue) 10px;border-top:var(--cue-rule) solid var(--rule-soft)}
.u-ed__cue:first-child{border-top:0}
.u-ed__cue.is-noted{background:var(--card);border-radius:var(--radius)}
.u-ed__cuetop{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px}
.u-ed__lead{font-weight:600;font-size:var(--fs-lead)}
.u-ed__say{font-style:italic;font-size:var(--fs-say);line-height:var(--lh-say);
  color:var(--ink-2);padding-left:11px;border-left:2px solid var(--rule)}
/* 旁批 is the one thing on this screen that is never spoken — always the same red */
.u-ed__note{display:flex;gap:7px;align-items:flex-start;padding-left:11px}
.u-ed__notelbl{color:var(--over);font-size:9px;padding-top:3px;flex:0 0 auto}
.u-ed__notetext{font-size:var(--ed-note);color:var(--over);line-height:1.5}

.u-ed__scriptwrap{flex:1;min-height:0;overflow-y:auto}
.u-ed__script{font-size:var(--fs-script);line-height:var(--lh-script);color:var(--ink)}
.u-ed__script p{margin:0 0 var(--gap-script)}
.u-ed__script p:last-child{margin-bottom:0}
/* <b> in a script means say it louder, so it gets the highlighter, not bold alone */
.u-ed__script b,.u-ed__script strong{font-weight:600;
  box-shadow:inset 0 calc(var(--fs-script) / -2) 0 var(--wash)}
.u-ed__script:focus,.u-ed__script:focus-visible{outline:none}
.u-ed__scriptfoot{flex:0 0 auto;padding-top:11px;border-top:1px solid var(--rule-soft);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.u-ed__footnote{font-size:var(--ed-meta);color:var(--ink-3)}
.u-ed__est{font-size:var(--ed-body);font-weight:600}
.u-ed__est--go{color:var(--go)}
.u-ed__est--tight{color:var(--tight)}
.u-ed__est--over{color:var(--over)}

/* ---------- right: inspector ---------- */
.u-ed__panel{background:var(--paper-2);border-left:1px solid var(--rule);
  padding:14px 16px 0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.u-ed__tabs{flex:0 0 auto;display:flex;gap:4px;padding-bottom:10px}
.u-ed__tab{padding:6px 11px;border:0;border-radius:3px;background:transparent;
  color:var(--ink-2);cursor:pointer}
.u-ed__tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.u-ed__panelbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.u-ed__panelbody--check{gap:0}
.u-ed__panelfoot{flex:0 0 auto;padding:11px 0 14px;border-top:1px solid var(--rule)}
.u-ed__sec{display:flex;flex-direction:column;gap:8px}
.u-ed__sechead{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.u-ed__tiny{font-size:var(--ed-nano);color:var(--ink-3);line-height:1.6}
.u-ed__lbl--over{color:var(--over)}
.u-ed__empty{font-size:12px;color:var(--ink-3);line-height:1.5}

.u-ed__stepper{display:flex;align-items:center;gap:9px}
.u-ed__budgetbig{font-size:27px;font-weight:600;letter-spacing:-.02em}
.u-ed__mini{font-size:var(--ed-nano);padding:4px 8px}
.u-ed__mini--step{font-size:var(--ed-body);padding:4px 10px;line-height:1}
/* scoped: 01-base.css owns .u-btn, this module only says what its own
   unavailable buttons look like */
.u-ed .u-btn[disabled]{opacity:.5;cursor:default}
.u-ed .u-btn[disabled]:hover{border-color:var(--rule)}
.u-ed__hint{display:flex;align-items:center;gap:8px;padding:8px 10px;
  border:1px solid var(--rule);border-radius:3px;background:var(--card)}
.u-ed__hint--go{background:var(--go-bg);border-color:var(--go-bd)}
.u-ed__hint--go .u-ed__hinttext{color:var(--go)}
.u-ed__hint--tight{background:var(--tight-bg);border-color:var(--tight-bd)}
.u-ed__hint--tight .u-ed__hinttext{color:var(--tight)}
.u-ed__hint--over{background:var(--over-bg);border-color:var(--over-bd)}
.u-ed__hint--over .u-ed__hinttext{color:var(--over)}
.u-ed__hinttext{flex:1;font-size:12px;color:var(--ink-2)}
/* moving a budget never shortens a talk; the caveat sits under the button that
   most looks like it might */
.u-ed__caveat{color:var(--ink-3)}

.u-ed__tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.u-ed__tag{cursor:pointer;font-family:var(--cond)}
.u-ed__tag--add{color:var(--ink-3);border-style:dashed;border-color:var(--rule-soft);background:transparent}
.u-ed__tag--add:hover{color:var(--ink-2);border-color:var(--rule)}
.u-ed__field{flex:1;min-width:0;font-family:var(--sans);font-size:12px;color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:4px 7px}

.u-ed__notes{display:flex;flex-direction:column;gap:7px}
.u-ed__panelnote{display:flex;gap:6px;font-size:var(--ed-note);color:var(--over);
  line-height:1.5;padding-left:9px;border-left:2px solid var(--over-bd)}
.u-ed__noteref{font-size:var(--ed-nano);color:var(--ink-3);flex:0 0 auto;padding-top:2px}

.u-ed__runs{display:flex;flex-direction:column}
.u-ed__run{display:flex;align-items:baseline;gap:8px;padding:7px 0;
  border-bottom:1px solid var(--rule-soft)}
.u-ed__run:last-child{border-bottom:0}
.u-ed__runn{font-size:var(--ed-small);color:var(--ink-3);width:44px;flex:0 0 44px}
.u-ed__runv{font-size:var(--ed-body);color:var(--ink-2)}
.u-ed__runv.is-last{font-weight:600;color:var(--ink)}
.u-ed__rundiff{font-size:var(--ed-meta);color:var(--ink-3);margin-left:auto}

/* ---------- right: the check ---------- */
.u-chk__item{display:flex;flex-direction:column;gap:6px;padding:13px 0;
  border-top:1px solid var(--rule-soft);cursor:pointer}
.u-chk__item:first-child{border-top:0}
.u-chk__item.is-here{margin-left:-11px;padding-left:9px;border-left:2px solid var(--ink)}
.u-chk__item:hover{background:var(--sel)}
.u-chk__top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.u-chk__where{font-size:var(--ed-micro);color:var(--ink-3)}
.u-chk__msg{font-size:var(--ed-note);color:var(--ink-2);line-height:1.55}
.u-chk__acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding-top:2px}

/* Marking a cue item as one you will actually look at on stage. The control
   sits in the item's own head so the choice is made where the words are, and
   an unmarked item stays fully legible at the desk — it is still part of the
   script, just not part of the card. */
.u-ed__pick{width:11px;height:11px;flex:0 0 11px;margin-top:calc(var(--fs-lead) * 0.28);
  border:1.5px solid var(--ink-4);border-radius:50%;background:transparent;padding:0;cursor:pointer}
.u-ed__pick:hover{border-color:var(--ink-2)}
.u-ed__pick.is-on{background:var(--tight);border-color:var(--tight)}
.u-ed__cue.is-desk{opacity:.58}
.u-ed__cue.is-desk .u-ed__pick{border-style:dashed}

/* ==== css/20-stage.css ==== */
/* The stage. Everything here lives under .u-stage, which 00-tokens.css remaps
   to the warm-black palette on the spot — the stage does not follow the desk's
   纸 / 夜 switch, because the room is dark and a bright screen lands on the
   speaker's face. Sizes come from the scale below so 紧凑 / 舒适 still moves
   type on stage; nothing here names a colour that is not a token. */

.u-stage {
  --stg-pad: 48px;
  --stg-gap: 32px;
  --stg-title: 26px;      /* beat title, serif */
  --stg-clock: 44px;      /* 本节剩余 — the number read from two metres */
  --stg-elapsed: 23px;
  --stg-drift: 19px;
  --stg-lead: 27px;       /* cue lead */
  --stg-say: 22px;        /* the line you actually say */
  --stg-note: 19px;       /* 旁批 */
  --stg-script: 21px;
  --stg-ask: 23px;
  --stg-row: 15px;        /* list rows */
  --stg-p-lead: 17px;     /* the second screen reads closer, so it runs smaller */
  --stg-p-say: 16px;
  --stg-p-script: 19px;
}
[data-density="roomy"] .u-stage {
  --stg-pad: 56px;
  --stg-gap: 40px;
  --stg-title: 29px;
  --stg-clock: 48px;
  --stg-elapsed: 25px;
  --stg-drift: 21px;
  --stg-lead: 30px;
  --stg-say: 24px;
  --stg-note: 21px;
  --stg-script: 23px;
  --stg-ask: 25px;
  --stg-row: 16.5px;
  --stg-p-lead: 18.5px;
  --stg-p-say: 17.5px;
  --stg-p-script: 21px;
}

.u-stage { height: 100%; background: var(--paper); color: var(--ink); }
.u-stage input::placeholder { color: var(--ink-4); }

/* the shared chips: the desk versions carry desk backgrounds, which would
   glow on a dark stage, so they are restated here from stage tokens only */
.u-stage .u-pill { font-size: 11px; padding: 3px 9px; background: var(--paper-2);
  border-color: var(--rule); color: var(--ink-2); }
.u-stage .u-pill--go { color: var(--go); border-color: color-mix(in srgb, var(--go) 45%, var(--paper));
  background: color-mix(in srgb, var(--go) 14%, var(--paper)); }
.u-stage .u-pill--tight { color: var(--tight); border-color: color-mix(in srgb, var(--tight) 45%, var(--paper));
  background: color-mix(in srgb, var(--tight) 14%, var(--paper)); }
.u-stage .u-pill--over { color: var(--over); border-color: color-mix(in srgb, var(--over) 45%, var(--paper));
  background: color-mix(in srgb, var(--over) 14%, var(--paper)); }
.u-stage .u-chip { color: var(--ink-3); background: none; border-color: var(--rule); padding: 1px 5px; }
.u-stage .u-btn { background: var(--paper-2); border-color: var(--rule); color: var(--ink); }
.u-stage .u-btn:hover { border-color: var(--ink-3); }
.u-stage .u-btn--primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* key hints — chips and labels rendered from U.keys.hints(), never by hand */
.u-stage__k { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  border: 1px solid var(--rule); border-radius: 2px; padding: 1px 5px; }
.u-stage__hints { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.u-stage__hint { display: flex; align-items: center; gap: 4px; margin-right: 10px; }
.u-stage__hintlabel { font-size: 11px; color: var(--ink-3); }
.u-stage__footnote { font-size: 12px; color: var(--ink-3); }
.u-stage__foot { height: 62px; flex: 0 0 62px; display: flex; align-items: center; gap: 12px;
  padding: 0 var(--stg-pad); border-top: 1px solid var(--paper-2); background: var(--paper); }

/* layers rise from below the top bar and never cover the clock */
.u-stage__layer { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
  background: var(--paper); }
.u-stage__layer--full { position: fixed; z-index: 9; }

/* blackout: the light goes, the clock does not */
.u-stage__black { align-items: center; justify-content: center; background: var(--paper); }
.u-stage__blackInner { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: .4; }
.u-stage__blackClock { font-size: 34px; font-weight: 600; letter-spacing: -.03em; color: var(--ink-3); }
.u-stage__blackElapsed { font-size: 13px; color: var(--ink-4); }
.u-stage__blackHint { font-size: 11px; color: var(--ink-4); }

/* ------------------------------------------------------------- 提词卡 */
.u-prompter { display: flex; flex-direction: column; overflow: hidden; }

/* the running-order thread: one segment per beat, weighted by budget */
.u-prompter__thread { height: 4px; flex: 0 0 4px; display: flex; gap: 2px; }
.u-prompter__seg { background: var(--card); display: flex; min-width: 2px; }
.u-prompter__seg.is-done { background: var(--ink-3); }
.u-prompter__seg.is-skip { opacity: .3; }
.u-prompter__segfill { background: var(--tight); transition: width 1s linear; }
/* under a minute the same line means something else — see 20-prompter.js */
.u-prompter__thread--last { height: 8px; flex: 0 0 8px; gap: 0; }
.u-prompter__lastTrack { flex: 1; display: flex; background: var(--card); }
.u-prompter__lastTrack.is-over { background: color-mix(in srgb, var(--over) 40%, var(--paper)); }
.u-prompter__lastFill { background: var(--tight); box-shadow: 0 0 14px -2px var(--tight);
  transition: width 1s linear; }

.u-prompter__top { height: 80px; flex: 0 0 80px; display: flex; align-items: center; gap: 22px;
  padding: 0 var(--stg-pad); border-bottom: 1px solid var(--paper-2); }
.u-prompter__where { display: flex; align-items: baseline; gap: 13px; min-width: 0; }
.u-prompter__n { font-size: 15px; font-weight: 500; color: var(--ink-3); flex: 0 0 auto; }
.u-prompter__of { font-size: 11px; }
.u-prompter__title { font-size: var(--stg-title); color: var(--ink-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.u-prompter__read { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.u-prompter__pair { display: flex; align-items: center; gap: 6px; }
.u-prompter__sep { width: 1px; height: 42px; background: var(--rule); }
.u-prompter__remain { font-size: var(--stg-clock); font-weight: 600; letter-spacing: -.03em;
  line-height: 1.18; color: var(--ink); }
.u-prompter__remain.is-tight { color: var(--tight); }
.u-prompter__remain.is-over { color: var(--over); }
.u-prompter__elapsed { font-size: var(--stg-elapsed); font-weight: 500; color: var(--ink-2); line-height: 1; }
.u-prompter__total { font-size: 12px; color: var(--ink-3); }
.u-prompter__drift { font-size: var(--stg-drift); font-weight: 600; line-height: 1; }
.u-prompter__dot { width: 11px; height: 11px; border-radius: 50%; background: var(--ink-3); }
.is-go.u-prompter__dot { background: var(--go); box-shadow: 0 0 12px -2px var(--go); }
.is-tight.u-prompter__dot { background: var(--tight); box-shadow: 0 0 12px -2px var(--tight); }
.is-over.u-prompter__dot { background: var(--over); box-shadow: 0 0 12px -2px var(--over); }
.u-prompter__drift.is-go { color: var(--go); }
.u-prompter__drift.is-tight { color: var(--tight); }
.u-prompter__drift.is-over { color: var(--over); }

.u-prompter__stack { position: relative; flex: 1; min-height: 0; display: flex; }
.u-prompter__card { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.u-prompter__cues { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column;
  gap: var(--stg-gap); padding: 26px var(--stg-pad) 22px;
  justify-content: center; justify-content: safe center; }
.u-prompter__cue { display: flex; flex-direction: column; gap: 9px; }
.u-prompter__cue.is-flagged { background: var(--paper-2); border-left: 3px solid var(--tight);
  margin: 0 -20px; padding: 16px 20px; border-radius: 0 3px 3px 0; }
.u-prompter__cuehead { display: flex; align-items: baseline; gap: 11px; flex-wrap: wrap; }
.u-prompter__lead { font-size: var(--stg-lead); font-weight: 600; line-height: 1.28; color: var(--ink); }
.u-prompter__say { font-size: var(--stg-say); font-style: italic; line-height: 1.5; color: var(--ink-2);
  padding-left: 16px; border-left: 2px solid var(--rule); }
.u-prompter__say b { color: var(--ink); font-style: normal; font-weight: 600; }
.u-prompter__note { display: flex; align-items: baseline; gap: 11px; padding-left: 16px;
  font-size: var(--stg-note); line-height: 1.4; color: var(--over); }
.u-prompter__notelbl { color: var(--over); flex: 0 0 auto; }
.u-prompter__nextn { font-size: 13px; color: var(--ink-3); }
.u-prompter__nexttitle { font-size: 15px; color: var(--ink-2); }
.u-prompter__nextbudget { font-size: 12px; color: var(--ink-3); }

/* ------------------------------------------------------------- 弹药库 */
.u-drawer { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper-2); }
.u-drawer__bar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; gap: 6px;
  padding: 0 32px; border-bottom: 1px solid var(--card); }
.u-drawer__tabs { display: flex; gap: 4px; }
.u-drawer__tab { font-size: 12px; letter-spacing: .1em; padding: 8px 14px; border-radius: 3px;
  border: 0; background: none; color: var(--ink-2); cursor: pointer; }
.u-drawer__tab.is-on { background: var(--ink); color: var(--paper); }
.u-drawer__count { opacity: .6; margin-left: 5px; }
.u-drawer__search { display: flex; align-items: center; gap: 9px; border: 1px solid var(--rule);
  border-radius: 3px; padding: 6px 11px; width: 290px; }
.u-drawer__input { flex: 1; min-width: 0; border: 0; background: none; outline: none;
  color: var(--ink); font-size: 12px; font-family: var(--mono); }
.u-drawer__body { flex: 1; min-height: 0; display: grid; grid-template-columns: 490px minmax(0, 1fr); }
.u-drawer__list { display: flex; flex-direction: column; padding: 8px 0; overflow: auto;
  border-right: 1px solid var(--card); }
.u-drawer__row { display: flex; align-items: center; gap: 10px; padding: 11px 20px 11px 14px;
  border-left: 3px solid transparent; cursor: pointer; }
.u-drawer__row.is-on { background: var(--card); border-left-color: var(--tight); }
.u-drawer__dot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 5px; background: none; }
.u-drawer__dot.is-related { background: var(--tight); }
.u-drawer__q { font-size: var(--stg-row); color: var(--ink-2); flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-drawer__row.is-on .u-drawer__q { color: var(--ink); }
.u-drawer__asked { font-size: 10px; color: var(--ink-3); flex: 0 0 auto; }
.u-drawer__legend { margin-top: auto; padding: 12px 20px 4px; display: flex; align-items: center;
  gap: 8px; font-size: 10.5px; color: var(--ink-3); }
.u-drawer__detail { padding: 26px 40px; display: flex; flex-direction: column; gap: 16px;
  min-height: 0; overflow: auto; }
.u-drawer__chips { display: flex; gap: 6px; flex-wrap: wrap; }
.u-drawer__ask { font-size: var(--stg-ask); color: var(--ink-2); line-height: 1.35; }
.u-drawer__answer { font-size: var(--stg-lead); line-height: 1.5; color: var(--ink);
  padding-left: 18px; border-left: 2px solid var(--tight); }
.u-drawer__note { display: flex; align-items: baseline; gap: 11px; font-size: var(--stg-note);
  line-height: 1.4; color: var(--over); }
.u-drawer__notelbl { color: var(--over); flex: 0 0 auto; }
.u-drawer__foot { margin-top: auto; display: flex; align-items: center; gap: 10px;
  padding-top: 12px; border-top: 1px solid var(--card); }
.u-drawer__last, .u-drawer__markhint { font-size: 11px; color: var(--ink-3); }
.u-drawer__markhint { color: var(--ink-2); }
.u-drawer__empty { font-size: 12px; color: var(--ink-3); }

/* ------------------------------------------------------------ 卡壳保险 */
.u-panic { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); }
.u-panic__bar { display: flex; align-items: center; gap: 13px; padding: 20px var(--stg-pad) 0; }
.u-panic__hint { display: flex; align-items: center; gap: 5px; font-size: var(--stg-row); color: var(--ink-2); }
.u-panic__tweak { font-size: 11px; color: var(--tight); }
.u-panic__sum { font-size: 12.5px; color: var(--ink-3); }
.u-panic__body { flex: 1; min-height: 0; display: flex; gap: 20px; padding: 16px var(--stg-pad) 14px; }
.u-panic__rail { width: 3px; flex: 0 0 3px; background: var(--paper-2); border-radius: 2px; position: relative; }
.u-panic__dot { position: absolute; left: -3px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--tight); transform: translateY(-50%); box-shadow: 0 0 10px -1px var(--tight);
  transition: top .3s ease; }
.u-panic__script { flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column;
  gap: 15px; font-size: var(--stg-script); line-height: 1.62; }
.u-panic__p { margin: 0; color: var(--ink-2); }
.u-panic__p.is-past { color: var(--ink-3); }
.u-panic__p.is-here { color: var(--ink); background: var(--paper-2); border-left: 3px solid var(--tight);
  padding: 13px 17px; border-radius: 0 3px 3px 0; }

/* --------------------------------------------------------- 只剩 N 分钟 */
.u-reflow { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px;
  padding-top: 20px; background: var(--paper); }
.u-reflow > *:not(.u-stage__foot) { margin-left: var(--stg-pad); margin-right: var(--stg-pad); }
.u-reflow__bar { display: flex; align-items: center; gap: 9px; }
.u-reflow__ask { font-size: 25px; color: var(--ink); }
.u-reflow__picks { display: flex; gap: 9px; }
.u-reflow__pick { font-size: 14px; padding: 8px 16px; border-radius: 3px; cursor: pointer;
  border: 1px solid var(--rule); background: none; color: var(--ink-2); }
.u-reflow__pick.is-on { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.u-reflow__custom { width: 110px; font-size: 14px; padding: 8px 12px; border-radius: 3px;
  border: 1px solid var(--rule); background: none; color: var(--ink); }
.u-reflow__headline { display: flex; align-items: baseline; gap: 12px; padding: 13px 18px;
  background: var(--paper-2); border-left: 3px solid var(--over); border-radius: 0 3px 3px 0; }
.u-reflow__line { font-size: 17px; color: var(--ink); }
.u-reflow__cut { font-size: 17px; font-weight: 600; }
.u-reflow__cut.is-over { color: var(--over); }
.u-reflow__cut.is-go { color: var(--go); }
.u-reflow__note { font-size: 12px; color: var(--ink-3); }
.u-reflow__table { display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.u-reflow__row { display: grid; gap: 14px; align-items: baseline;
  grid-template-columns: 34px 240px minmax(0, 1fr) 104px 132px 66px;
  padding: 12px 0 11px; border-bottom: 1px solid var(--paper-2); }
.u-reflow__row.is-head { padding: 0 0 8px; border-bottom: 1px solid var(--card); }
.u-reflow__row.is-total { border-bottom: 0; padding-top: 10px; }
.u-reflow__row.is-skip { opacity: .55; }
.u-reflow__row.is-skip .u-reflow__title { text-decoration: line-through; color: var(--ink-3); }
.u-reflow__n { font-size: 12px; color: var(--ink-3); }
.u-reflow__title { font-size: 16px; color: var(--ink); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.u-reflow__how { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.u-reflow__imp { display: inline-flex; gap: 3px; align-items: center; }
.u-reflow__impdot { width: 5px; height: 5px; border-radius: 50%; background: var(--card); }
.u-reflow__impdot.is-on { background: var(--ink-2); }
.u-reflow__impword { font-size: 11px; color: var(--ink-3); margin-left: 5px; }
.u-reflow__times { display: flex; align-items: baseline; gap: 7px; }
.u-reflow__was { font-size: 13px; color: var(--ink-3); text-decoration: line-through; }
.u-reflow__arrow { font-size: 11px; color: var(--ink-3); }
.u-reflow__now { font-size: 16px; font-weight: 600; color: var(--ink); }
.u-reflow__now.is-over { color: var(--over); }
.u-reflow__now.is-go { color: var(--go); }
.u-reflow__delta { font-size: 13px; color: var(--ink-3); text-align: right; }
.u-reflow__delta.is-over { color: var(--over); }
.u-reflow__right { text-align: right; }
.u-reflow__knock { display: flex; align-items: flex-start; gap: 11px; padding: 13px 17px;
  background: var(--paper-2); border-radius: 3px; }
.u-reflow__knocklbl { color: var(--tight); flex: 0 0 auto; padding-top: 3px; }
.u-reflow__knocktext { font-size: var(--stg-row); color: var(--ink-2); line-height: 1.5; }
.u-reflow__makeup { color: var(--ink); font-style: italic; }
.u-reflow__actions { display: flex; align-items: center; gap: 9px; margin-top: auto; padding-bottom: 4px; }

/* ------------------------------------------------------------ 双屏 */
.u-presenter { display: flex; flex-direction: column; overflow: hidden; }
.u-presenter__top { height: 62px; flex: 0 0 62px; display: flex; align-items: center; gap: 16px;
  padding: 0 40px; border-bottom: 1px solid var(--paper-2); }
.u-presenter__badge { display: flex; align-items: center; gap: 7px; padding: 3px 9px;
  border: 1px solid var(--rule); border-radius: 12px; }
.u-presenter__badge .u-prompter__dot { width: 6px; height: 6px; }
.u-presenter__live { font-size: 10.5px; color: var(--ink-2); }
.u-presenter__read { display: flex; align-items: baseline; gap: 7px; }
.u-presenter__remain { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1; color: var(--ink); }
.u-presenter__remain.is-tight { color: var(--tight); }
.u-presenter__remain.is-over { color: var(--over); }
.u-presenter__elapsed { font-size: 17px; color: var(--ink-2); line-height: 1; }
.u-presenter__total { font-size: 11px; color: var(--ink-3); }
.u-presenter__drift { font-size: 16px; font-weight: 600; line-height: 1; }
.u-presenter__drift.is-go { color: var(--go); }
.u-presenter__drift.is-tight { color: var(--tight); }
.u-presenter__drift.is-over { color: var(--over); }
.u-presenter__body { flex: 1; min-height: 0; display: grid; gap: 30px; padding: 22px 40px;
  grid-template-columns: 58% minmax(0, 1fr); }
.u-presenter__body.is-swapped .u-presenter__left { order: 2; }
.u-presenter__body.is-swapped .u-presenter__right { order: 1; }
.u-presenter__left { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
/* the audience's slide is a bright thing even in a dark room */
.u-presenter__slide { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px;
  background: var(--ink); border: 1px solid var(--card); border-radius: 3px; padding: 24px 26px; }
.u-presenter__slidehead { display: flex; flex-direction: column; gap: 3px; }
.u-presenter__slidetitle { font-size: 20px; font-weight: 600; color: var(--paper); }
.u-presenter__slideref { font-size: 11px; color: color-mix(in srgb, var(--paper) 55%, var(--ink)); }
.u-presenter__grid { flex: 1; min-height: 0; display: grid; grid-auto-rows: 1fr; gap: 2px; }
.u-presenter__cell { background: color-mix(in srgb, var(--paper) 14%, transparent); border-radius: 1px; }
.u-presenter__cell.is-yours { background: color-mix(in srgb, var(--tight) 55%, transparent); }
.u-presenter__next { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }
.u-presenter__thumb { width: 150px; height: 84px; flex: 0 0 150px; display: flex; flex-direction: column;
  gap: 4px; padding: 7px; border: 1px solid var(--card); border-radius: 2px;
  background: color-mix(in srgb, var(--ink) 92%, var(--paper)); }
.u-presenter__thumbbar { height: 5px; width: 64%; border-radius: 1px;
  background: color-mix(in srgb, var(--paper) 30%, transparent); }
.u-presenter__grid--thumb { gap: 1.5px; }
.u-presenter__nextmeta { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.u-presenter__nextline { display: flex; align-items: baseline; gap: 9px; }
.u-presenter__nexttitle { font-size: 15px; color: var(--ink-2); }
.u-presenter__nextbudget { font-size: 11px; color: var(--ink-3); }
.u-presenter__firstline { display: flex; align-items: baseline; gap: 9px; }
.u-presenter__firstlbl { color: var(--tight); flex: 0 0 auto; }
.u-presenter__first { font-size: var(--stg-p-say); font-style: italic; color: var(--ink); line-height: 1.4; }
.u-presenter__right { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
.u-presenter__block { display: flex; flex-direction: column; gap: 9px; padding-bottom: 14px;
  border-bottom: 1px solid var(--paper-2); }
.u-presenter__cuehead { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.u-presenter__lead { font-size: var(--stg-p-lead); font-weight: 600; color: var(--ink); line-height: 1.3; }
.u-presenter__note { display: flex; align-items: baseline; gap: 9px; font-size: var(--stg-p-say);
  color: var(--over); line-height: 1.35; }
.u-presenter__rule { display: flex; align-items: center; gap: 8px; }
.u-presenter__hair { flex: 1; height: 1px; background: var(--paper-2); }
.u-presenter__auto { font-size: 10px; color: var(--ink-3); }
.u-presenter__script { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column;
  gap: 13px; font-size: var(--stg-p-script); line-height: 1.62; }
.u-presenter__p { margin: 0; color: var(--ink-3); }
.u-presenter__p.is-here { color: var(--ink); background: var(--paper-2); border-left: 3px solid var(--tight);
  padding: 11px 14px; border-radius: 0 3px 3px 0; }
.u-presenter__chips { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0; }
.u-presenter__bt { font-size: 10.5px; color: var(--ink-3); background: var(--paper-2);
  border-radius: 2px; padding: 3px 7px; white-space: nowrap; }
.u-presenter__bt.is-now { background: var(--tight); color: var(--paper); font-weight: 600; }
.u-presenter__bt.is-skip { text-decoration: line-through; opacity: .5; }
.u-presenter__bt.is-quiet { background: none; }

/* ==== css/30-rehearsal.css ==== */
/* 排练设置 · 排练复盘 · 讲后回填。

   一个颜色都不写死：纸/夜靠 00-tokens.css 的两套令牌，紧凑/舒适靠下面这一小把
   本地刻度 —— 它们全部由 --fs-ui / --pad-cue 派生，所以密度开关照样能推动这三块屏，
   而不是只推动别人的屏。设计稿里的 10.5px / 27px / 50px 都是从这里算出来的。 */
.u-reh__page {
  --f-xs:  calc(var(--fs-ui) - 3.5px);
  --f-sm:  calc(var(--fs-ui) - 2px);
  --f-md:  calc(var(--fs-ui) - 1px);
  --f-lg:  calc(var(--fs-ui) + 2px);
  --f-stat:calc(var(--fs-ui) * 1.93);
  --f-hero:calc(var(--fs-ui) * 3.57);
  --f-h1:  calc(var(--fs-ui) * 2.43);
  --sp:    var(--pad-cue);
  --sp-1:  calc(var(--pad-cue) * 0.5);
  --sp-2:  calc(var(--pad-cue) * 0.75);
  --sp-3:  calc(var(--pad-cue) * 1.5);
  --sp-4:  calc(var(--pad-cue) * 2.4);
  --lane:  24px;
  --lane-bar: 22px;

  height: 100%; display: flex; flex-direction: column; background: var(--paper);
}
.u-reh__body {
  flex: 1; min-height: 0; overflow: auto;
  display: flex; flex-direction: column; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4) var(--sp-3);
}
.u-reh__h1 { font-size: var(--f-h1); line-height: 1.12; }
.u-reh__lbl { color: var(--ink); }
.u-reh__ico { display: inline-flex; align-items: center; color: currentColor; }
.u-reh__ico svg { display: block; }

/* 键位提示：绑了什么就印什么 */
.u-reh__keys { display: flex; flex-wrap: wrap; gap: var(--sp-3); padding-top: var(--sp-2);
  border-top: 1px solid var(--rule-soft); margin-top: auto; }
.u-reh__key { display: inline-flex; align-items: center; gap: 5px; font-size: var(--f-xs); color: var(--ink-3); }
.u-reh__cap { border: 1px solid var(--rule); border-radius: 2px; padding: 1px 5px;
  font-size: var(--f-xs); color: var(--ink-2); background: var(--card); }

/* ================= 排练设置 ================= */
.u-reh__head { display: flex; align-items: flex-end; gap: var(--sp-2); }
.u-reh__title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.u-reh__sub { font-size: var(--f-md); color: var(--ink-2); }
.u-reh__grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px;
  gap: var(--sp-4); min-height: 0; align-items: start; }
.u-reh__levels { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }

.u-reh__lv { display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left;
  padding: var(--sp) var(--sp-3); border-radius: var(--radius); border: 1px solid var(--rule);
  background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
.u-reh__lv:hover { border-color: var(--ink-3); }
.u-reh__lv.is-on { border-color: var(--ink); background: var(--card); }
.u-reh__radio { width: 15px; height: 15px; flex: 0 0 15px; border-radius: 50%;
  border: 1.5px solid var(--rule); display: flex; align-items: center; justify-content: center; }
.u-reh__lv.is-on .u-reh__radio { border-color: var(--ink); }
.u-reh__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.u-reh__lvname { width: 196px; flex: 0 0 196px; display: flex; flex-direction: column; gap: 2px; }
.u-reh__lvtitle { display: flex; align-items: baseline; gap: 8px; }
.u-reh__lvn { font-size: var(--f-xs); color: var(--ink-3); }
.u-reh__lvlabel { font-size: var(--f-lg); font-weight: 600; }
.u-reh__lvdesc { font-size: var(--f-sm); color: var(--ink-2); line-height: 1.4; }
.u-reh__vislist { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
.u-reh__when { font-size: var(--f-xs); color: var(--ink-3); flex: 0 0 auto; }

/* 三态标签：实线 = 看得到 · 灰框 = 按键才出来 · 划掉 = 藏起来 */
.u-reh__vis { font-size: var(--f-xs); padding: 2px 7px; border-radius: 2px; border: 1px solid transparent; }
.u-reh__vis--shown  { background: var(--ink); color: var(--paper); }
.u-reh__vis--key    { background: var(--card); color: var(--ink-3); border-color: var(--rule); }
.u-reh__vis--hidden { background: transparent; color: var(--ink-4); border: 1px dashed var(--rule-soft);
  text-decoration: line-through; }
.u-reh__legend { font-size: var(--f-xs); color: var(--ink-3); padding-top: 2px; }

.u-reh__side { display: flex; flex-direction: column; gap: var(--sp-3); min-height: 100%; }
.u-reh__group { display: flex; flex-direction: column; gap: var(--sp-2); }
.u-reh__rec { display: flex; align-items: center; gap: var(--sp-2); text-align: left;
  padding: var(--sp) var(--sp-2); border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
.u-reh__rec:hover { border-color: var(--ink-3); }
.u-reh__sw { width: 34px; height: 19px; flex: 0 0 34px; border-radius: 10px; background: var(--ink-4);
  display: flex; align-items: center; justify-content: flex-start; padding: 0 2px; }
.u-reh__sw.is-on { background: var(--go); justify-content: flex-end; }
.u-reh__knob { width: 15px; height: 15px; border-radius: 50%; background: var(--card); }
.u-reh__rectext { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.u-reh__recline { font-size: var(--f-md); font-weight: 500; }
.u-reh__recnote { font-size: var(--f-xs); color: var(--ink-3); }
/* 转写为什么关着，就写在这里，不埋进设置 */
.u-reh__note { display: flex; align-items: flex-start; gap: var(--sp-1); padding: var(--sp-2) var(--sp);
  background: var(--card-2); border: 1px solid var(--rule-soft); border-radius: var(--radius); }
.u-reh__notelbl { flex: 0 0 auto; padding-top: 3px; }
.u-reh__notetext { font-size: var(--f-sm); color: var(--ink-2); line-height: 1.5; }
.u-reh__chips { display: flex; gap: 7px; flex-wrap: wrap; }
.u-reh__chip { font-size: var(--f-xs); padding: 7px 13px; cursor: pointer; background: var(--card); }
.u-reh__chip.is-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.u-reh__chip.is-off { opacity: .45; cursor: default; }
.u-reh__go { margin-top: auto; text-align: center; padding: var(--sp); font-size: var(--f-md); }

.u-reh__foot { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  padding-top: var(--sp-2); border-top: 1px solid var(--rule); }
.u-reh__prev { display: flex; align-items: baseline; gap: var(--sp-1); }
.u-reh__prevn { font-size: var(--f-xs); color: var(--ink-3); }
.u-reh__prevt { font-size: var(--fs-ui); font-weight: 600; }
.u-reh__stance { font-size: var(--f-sm); color: var(--ink-2); }

/* ================= 排练复盘 ================= */
.u-rc__head { display: flex; align-items: flex-end; gap: var(--sp-2); flex-wrap: wrap; }
.u-rc__title { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.u-rc__sub { font-size: var(--f-xs); color: var(--ink-3); }
.u-rc__hint { font-size: var(--f-xs); color: var(--ink-3); }
.u-rc__ra { text-align: right; }
.u-rc__pills { display: flex; gap: 6px; flex-wrap: wrap; }
.u-rc__pill { cursor: pointer; background: var(--card); }
.u-rc__pill.is-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.u-rc__empty { display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-start; }

.u-rc__stats { display: grid; grid-template-columns: 340px repeat(3, minmax(0, 1fr)); gap: var(--sp); }
.u-rc__tile { display: flex; flex-direction: column; gap: 4px; padding: var(--sp) var(--sp-3); }
.u-rc__tile--hero { background: var(--ink); border-color: var(--ink); }
.u-rc__tile--hero .u-lbl { color: var(--ink-4); }
.u-rc__heroval { display: flex; align-items: baseline; gap: var(--sp); flex-wrap: wrap; }
.u-rc__hero { font-size: var(--f-hero); font-weight: 600; letter-spacing: -.035em; line-height: 1.14;
  color: var(--paper); }
.u-rc__herodelta { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.u-rc__heronote { font-size: var(--f-xs); color: var(--ink-4); }
/* 颜色带着字一起说话，从不单独表意 */
.u-rc__badge { font-size: var(--f-xs); font-weight: 600; padding: 1px 6px; border-radius: 2px; }
.u-rc__badge--over { background: var(--over); color: var(--card); }
.u-rc__badge--go { background: var(--go); color: var(--card); }
.u-rc__stat { font-size: var(--f-stat); font-weight: 600; line-height: 1.15; }
.u-rc__stat--go { color: var(--go); }
.u-rc__stat--over { color: var(--over); }
.u-rc__stat--mute { color: var(--ink-3); }
.u-rc__unit { font-size: var(--f-md); font-weight: 400; color: var(--ink-3); }
.u-rc__tilenote { font-size: var(--f-xs); color: var(--ink-3); }

.u-rc__tl { padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
.u-rc__tlhead { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }

/* ==== css/40-library.css ==== */
/* 后台 · AI 填充 · 打印。

   Every size here is derived from --fs-ui and every colour from the token set,
   so 纸/夜 and 紧凑/舒适 keep working on these screens without a second layout.
   The design sheets specify px and hex; the arithmetic below is that same
   ladder expressed against the one variable the density switch moves. */
.u-lib, .u-ai, .u-print {
  --f-h1:calc(var(--fs-ui) * 3);        /* 42 */
  --f-h2:calc(var(--fs-ui) * 2.43);     /* 34 */
  --f-big:calc(var(--fs-ui) * 2.07);    /* 29 */
  --f-lead:calc(var(--fs-ui) * 1.64);   /* 23 */
  --f-title:calc(var(--fs-ui) * 1.43);  /* 20 */
  --f-strong:calc(var(--fs-ui) * 1.07); /* 15 */
  --f-meta:calc(var(--fs-ui) - 1px);    /* 13 */
  --f-num:calc(var(--fs-ui) - 1.5px);   /* 12.5 */
  --f-run:calc(var(--fs-ui) - 2.5px);   /* 11.5 */
  --f-small:calc(var(--fs-ui) - 3px);   /* 11 */
  --f-micro:calc(var(--fs-ui) - 3.5px); /* 10.5 */
  --f-tiny:calc(var(--fs-ui) - 4px);    /* 10 */
  --f-nano:calc(var(--fs-ui) - 4.5px);  /* 9.5 */

  --pad-page:34px 56px 40px;
  --gap-block:26px;
  --pad-row:17px 20px;
}
[data-density="roomy"] .u-lib,
[data-density="roomy"] .u-ai {
  --pad-page:42px 64px 48px;
  --gap-block:32px;
  --pad-row:23px 22px;
}

   actually coming, and it should read as a different kind of thing from the

/* Built on demand by U.io.print() and hidden the rest of the time. One beat per

'use strict';
/* View registry + the shared key map.
   Keys live here rather than in each screen so a footer can print exactly what
   is bound and nothing can be bound-but-undiscoverable — the failure the
   design read-through actually caught. */
U.views = (function () {
  var reg = {};
  return {
    register: function (name, def) { reg[name] = def; },
    get: function (name) { return reg[name]; },
    names: function () { return Object.keys(reg); },
    show: function (name) { U.store.ui({ view: name }); }
  };
})();

U.keys = (function () {
  var binds = [];      /* {view, key, label, fn, order} */
  function norm(e) {
    var k = e.key;
    if (k === ' ') return 'Space';
    if (k.length === 1) return k.toLowerCase();
    return k;
  }
  return {
    bind: function (view, key, label, fn, order) {
      binds.push({ view: view, key: String(key), label: label, fn: fn, order: order == null ? 50 : order });
    },
    /* What this view should print in its footer, in declared order. */
    hints: function (view) {
      return binds.filter(function (b) { return b.view === view && b.label; })
        .sort(function (a, b) { return a.order - b.order; })
        .map(function (b) { return { key: b.key, label: b.label }; });
    },
    handle: function (e) {
      if (e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return false;
      var view = U.store.get().ui.view, k = norm(e);
      var hit = binds.filter(function (b) { return b.view === view && b.key === k; });
      if (!hit.length) return false;
      e.preventDefault();
      hit.forEach(function (b) { b.fn(e); });
      return true;
    },
    all: function () { return binds.slice(); }
  };
})();

'use strict';
/* One run of the talk — a rehearsal or the real thing. Shared because both the
   stage screens and the rehearsal screens drive the same clock: whoever owned
   it privately would force the other to keep a second, drifting copy.

   The per-beat spend accrues to whichever beat is showing, which is what makes
   the recap able to say "the time leaked at 04" rather than only "you ran 47
   seconds over". */
U.run = (function () {
  var timer = null;
  /* Swappable so the tests can drive time by hand; nothing else touches it. */
  var now = function () {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  };

  function cur() { return U.store.get().run; }
  function beats() { return U.store.beats(); }

  /* Measured against a monotonic clock rather than counted per callback. A
     background tab is throttled to roughly one callback a minute, and the
     speaker WILL switch to their slide software — counting invocations would
     quietly undercount exactly the number this tool exists to report. Time
     recovered after a stall lands on the beat that was showing, because that
     is the beat it was spent on. */
  function tick() {
    var r = cur();
    if (!r || !r.running) return;
    var secs = Math.max(0, Math.round((api._now() - r.base) / 1000));
    var gained = secs - r.elapsed;
    if (gained <= 0) return;
    U.store.update(function () {
      r.elapsed = secs;
      var slot = r.perBeat[r.beatIndex];
      if (slot) slot.spent += gained;
    });
  }

  /* Which beats this run covers. A partial rehearsal that still let the
     arrows wander into unrehearsed beats would be a full rehearsal that
     happens to start in the middle. */
  function allowedIndexes() {
    var r = cur(), bs = beats();
    var ids = r && r.only;
    if (!ids || !ids.length) return null;
    var out = [];
    bs.forEach(function (b, i) { if (ids.indexOf(b.id) >= 0) out.push(i); });
    return out.length ? out : null;
  }
  /* Wall-clock ticking is a browser concern. Under node the tests drive
     _tick() by hand, and an interval there would just hold the process open. */
  function arm(on) {
    if (typeof window === 'undefined') return;
    if (timer) { clearInterval(timer); timer = null; }
    /* Twice a second: the clock is read, not counted, so a late callback
       costs nothing but a slightly stale countdown. */
    if (on) timer = setInterval(tick, 500);
  }

  var api = {
    /* difficulty: 1 照读 · 2 只看提词 · 3 冷启动 · 4 有人打断 */
    start: function (opts) {
      opts = opts || {};
      var p = U.store.production();
      U.store.update(function (s) {
        s.run = {
          mode: opts.mode || 'rehearse',
          difficulty: opts.difficulty || 1,
          target: opts.target || (p && p.target) || 0,
          recording: !!opts.recording,
          elapsed: 0, running: false, beatIndex: 0, finished: false, base: 0,
          perBeat: beats().map(function (b) { return { beat: b.id, spent: 0 }; })
        };
        s.ui.beatIndex = 0;
      });
      return cur();
    },
    toggle: function (on) {
      var r = cur(); if (!r) return null;
      var want = on == null ? !r.running : !!on;
      U.store.update(function () {
        /* Re-anchor on resume so a pause does not count as elapsed time. */
        if (want && !r.running) r.base = api._now() - r.elapsed * 1000;
        r.running = want;
      });
      arm(r.running);
      return r;
    },
    /* True when this beat is part of the run. Navigation consults it. */
    allows: function (index) {
      var allowed = allowedIndexes();
      return !allowed || allowed.indexOf(index) >= 0;
    },
    allowed: allowedIndexes,
    /* Move to a beat. Keeps run.beatIndex and ui.beatIndex in step so the
       screens and the clock can never disagree about where you are. */
    go: function (index) {
      var r = cur(), n = beats().length;
      var i = Math.max(0, Math.min(n - 1, index));
      var allowed = allowedIndexes();
      if (allowed && allowed.indexOf(i) < 0) {
        i = allowed.reduce(function (best, k) {
          return Math.abs(k - index) < Math.abs(best - index) ? k : best;
        }, allowed[0]);
      }
      U.store.update(function (s) { s.ui.beatIndex = i; if (r) r.beatIndex = i; });
      return i;
    },
    next: function () { return this.go(U.store.get().ui.beatIndex + 1); },
    prev: function () { return this.go(U.store.get().ui.beatIndex - 1); },

    /* Seconds left in the current beat's budget — negative once over. */
    remaining: function () {
      var r = cur(); if (!r) return null;
      var b = beats()[r.beatIndex]; if (!b) return null;
      return (Number(b.budget) || 0) - (r.perBeat[r.beatIndex] || { spent: 0 }).spent;
    },
    /* Ahead (negative) or behind (positive) the plan, recomputed only when a
       beat changes so it does not twitch while you are talking. */
    drift: function () {
      var r = cur(); if (!r) return 0;
      return U.driftAt(r.elapsed, beats(), r.beatIndex);
    },
    /* How far into this beat's script you probably are — what the ↓ key
       lands on. An estimate, and the screen says so. */
    scriptFraction: function () {
      var r = cur(); if (!r) return 0;
      var b = beats()[r.beatIndex]; if (!b || !b.budget) return 0;
      return Math.max(0, Math.min(1, (r.perBeat[r.beatIndex] || { spent: 0 }).spent / b.budget));
    },
    finish: function () {
      var r = cur(); if (!r) return null;
      arm(false);
      var p = U.store.production();
      var record = {
        n: (p.runs || []).length + 1, at: new Date().toISOString().slice(0, 16),
        difficulty: r.difficulty, mode: r.mode,
        perBeat: r.perBeat.map(function (x) { return { beat: x.beat, spent: x.spent }; }),
        total: r.elapsed
      };
      U.store.update(function (s) { (p.runs = p.runs || []).push(record); r.running = false; r.finished = true; });
      return record;
    },
    current: cur,
    /* Tests drive the clock by hand rather than waiting on wall time. */
    _tick: tick, _now: now
  };
  return api;
})();

   two different documents and they have to be written against each other.

  }

    if (secs == null) return { word: '准点', text: '0:00', tone: 'go' };
    var n = Math.round(secs);
    if (n === 0) return { word: '准点', text: '0:00', tone: 'go' };
    if (n < 0) return { word: '快', text: U.fmt(-n), tone: 'go' };
    return { word: '慢', text: U.fmt(n), tone: n > 30 ? 'over' : 'tight' };
  }
  function remainTone(secs) {
    if (secs == null) return '';
    if (secs < 0) return 'is-over';
    if (secs <= 15) return 'is-tight';
    return '';
  }
  return {
    skipped: skipped, playable: playable, step: step, finishRun: finishRun,
    nextIndex: nextIndex, nextBeat: nextBeat,
    drift: drift, remainTone: remainTone,
    LAST_MINUTE: 60
  };
})();

  update: function () {
    var ui = this._ui;
    if (!ui) return;
    var beats = U.store.beats(), i = U.store.get().ui.beatIndex;
    var beat = beats[i] || null, run = U.run.current();
    var remain = U.run.remaining();
    var totals = U.totals(beats, U.store.rate());

    /* --- top bar ------------------------------------------------------- */
    ui.n.textContent = (beat && beat.n) || '--';
    ui.n.appendChild(U.el('span', { class: 'u-prompter__of' }, ' / ' + beats.length));
    ui.title.textContent = (beat && beat.title) || '';
    ui.remain.textContent = remain == null ? '--:--' : U.fmt(remain);
    ui.remain.className = 'u-mono u-prompter__remain ' + U.prompter.remainTone(remain);

    ui.driftDot.className = 'u-prompter__dot is-' + d.tone;

    /* --- the thread ----------------------------------------------------- */
    /* Under a minute the thread changes meaning: it stops saying "which beat"
       and says "how much of this one is left", eight pixels tall and shrinking
       evenly to nothing. At that point the first meaning is of no use — you
       are in this beat and about to leave it — and one line can only carry one
       thing if it is to be read out of the corner of an eye. */
    var last = remain != null && remain <= U.prompter.LAST_MINUTE;
    U.clear(ui.thread);
    ui.thread.className = 'u-prompter__thread' + (last ? ' u-prompter__thread--last' : '');
    ui.thread.setAttribute('data-thread', last ? 'last-minute' : 'running-order');
    if (last) {
      var left = Math.max(0, Math.min(1, (remain || 0) / U.prompter.LAST_MINUTE));
      var track = U.el('div', { class: 'u-prompter__lastTrack' + (remain < 0 ? ' is-over' : '') }, [
        U.el('div', { class: 'u-prompter__lastFill', style: { width: (left * 100).toFixed(2) + '%' } })
      ]);
      ui.thread.appendChild(track);
    } else {
      beats.forEach(function (b, j) {
        var w = Math.max(20, Number(b.budget) || 0);
        var seg = U.el('div', {
          class: 'u-prompter__seg' + (j < i ? ' is-done' : '') + (j === i ? ' is-now' : '') +
            (U.prompter.skipped(b) ? ' is-skip' : ''),
          style: { flex: String(w) }, title: b.n + ' ' + b.title
        });
        if (j === i) {
          var spent = run && run.perBeat[i] ? run.perBeat[i].spent : 0;
          var f = Math.max(0, Math.min(1, spent / (Number(b.budget) || 1)));
          seg.appendChild(U.el('div', { class: 'u-prompter__segfill', style: { width: (f * 100).toFixed(2) + '%' } }));
        }
        ui.thread.appendChild(seg);
      });
    }

    /* --- the cues (rebuilt only when the beat changes) -------------------- */
    if (this._at !== i) {
      this._at = i;
      U.clear(ui.cues);
      U.onstageCue(beat).forEach(function (c) {
        var flagged = /^(SLOW|PAUSE|ASK)$/.test(c.flag || '');
        var head = U.el('div', { class: 'u-prompter__cuehead' });
        if (c.flag) head.appendChild(U.el('span', {
          class: 'u-pill u-pill--' + (c.flag === 'OPEN' ? 'over' : c.flag === 'SAY' ? 'go' : 'tight')
        }, c.flag));
        (c.cols || []).forEach(function (col) {
          head.appendChild(U.el('span', { class: 'u-pill u-pill--tight u-prompter__col' }, col));
        });
        head.appendChild(U.el('span', { class: 'u-prompter__lead', html: c.lead || '' }));

        var item = U.el('div', { class: 'u-prompter__cue' + (flagged ? ' is-flagged' : '') }, [head]);
        (c.say || []).forEach(function (s) {
          item.appendChild(U.el('div', { class: 'u-read u-prompter__say', html: s }));
        });
        (c.notes || []).forEach(function (n) {
          item.appendChild(U.el('div', { class: 'u-prompter__note' }, [
            U.el('span', { class: 'u-lbl u-prompter__notelbl' }, '旁批'),
            U.el('span', { text: n })
          ]));
        });
        ui.cues.appendChild(item);
      });
      var nb = U.prompter.nextBeat(i);
      ui.nextN.textContent = nb ? nb.n : '';
      /* Say what the arrow does here, or the end of the run is a key that is
         bound and printed nowhere — the thing the key registry exists to stop. */
      ui.nextTitle.textContent = nb ? nb.title
        : '这是最后一节 · 按 → 结束，去' + (((U.run.current() || {}).mode === 'live') ? '回填' : '复盘');
      ui.nextBudget.textContent = nb ? U.fmt(nb.budget) : '';
    }

    U.stage.update(U.store.get());
  }
});

/* ==== js/21-drawer.js ==== */
'use strict';
/* 弹药库 — the one place on stage you go to look something up: what you might
   be asked, the glossary, and the fallback lines.

   Two decisions from the design carry the whole screen. It rises from below
   the top bar, so the clock is never covered. And whatever relates to the beat
   you are standing in sorts to the top with an amber dot, because the question
   you are about to be asked is almost always about the slide that is up.

   Relevance is worked out here, in plain arithmetic, so it can be tested
   without a browser:
     · an explicit tag on the entry naming this beat — the strongest signal
     · the entry naming one of this beat's columns
     · words this beat uses that the rest of the talk mostly does not, which is
       what catches "repeat-visit column" on the beat about column W without
       anybody having tagged anything. */

U.drawer = (function () {
  var RELATED = 2;                 /* score at which an entry earns the dot */
  var COMMON = 0.25;               /* a word in more than this share of beats says nothing */
  /* The document-frequency cut below does most of the filtering; this short
     list is here so that a two-beat talk, where nothing is "common", still
     behaves. */
  var STOP = ('the and that this with have from they will what when where which who whose ' +
    'would could should there their them then than about into onto over under after before ' +
    'while your yours ours been being does done here more most some such only just also very ' +
    'much many both each other same well because please need needs want able really every ' +
    'else make makes take takes give gives back down again still even ever never always ' +
    'something anything nothing someone anyone everyone').split(' ');

  function tokens(text) {
    var t = String(text == null ? '' : text).toLowerCase(), out = [];
    (t.match(/[a-z][a-z0-9']{3,}/g) || []).forEach(function (w) {
      w = w.replace(/'s$/, '');
      if (STOP.indexOf(w) < 0) out.push(w);
    });
    (t.match(/[一-鿿]+/g) || []).forEach(function (run) {
      for (var i = 0; i + 1 < run.length; i++) out.push(run.slice(i, i + 2));
    });
    return out;
  }
  function set(list) {
    var o = {};
    list.forEach(function (w) { o[w] = true; });
    return o;
  }
  function beatText(beat) {
    if (!beat) return '';
    var parts = [beat.title || '', beat.nav || ''];
    (beat.cue || []).forEach(function (c) {
      parts.push(U.textOf(c.lead));
      (c.say || []).forEach(function (s) { parts.push(U.textOf(s)); });
      (c.notes || []).forEach(function (n) { parts.push(n); });
    });
    return parts.join(' ');
  }
  function itemText(item) {
    if (!item) return '';
    return [item.q, item.a, item.term, item.say, item.note, item.when,
      (item.tags || []).map(label).join(' ')].filter(Boolean).join(' ');
  }
  function label(tag) { return typeof tag === 'string' ? tag : (tag && (tag.label || tag.kind)) || ''; }
  function cols(beat) {
    var seen = {}, out = [];
    ((beat && beat.cue) || []).forEach(function (c) {
      (c.cols || []).forEach(function (col) {
        var k = String(col).trim();
        if (k && !seen[k]) { seen[k] = true; out.push(k); }
      });
    });
    return out;
  }
  /* A column name is a word lifted out of whatever the beat happens to say, so
     it can be anything at all — including "count(*)", which is regex syntax
     twice over. Escaped so it cannot throw, and the word boundary is only
     asserted on an edge that is actually a word, or a name ending in a bracket
     could never match anything. */
  function colHit(text, col) {
    var raw = String(col == null ? '' : col);
    if (!raw) return false;
    var c = raw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var tail = /\w$/.test(raw) ? '\\b' : '';
    var head = /^\w/.test(raw) ? '\\b' : '';
    return new RegExp('(?:columns?|col|列)\\s*' + c + tail + '|' + head + c + '\\s*列', 'i').test(text);
  }
  function tagHit(tag, beat) {
    var t = String(label(tag)).toLowerCase();
    if (!t) return false;
    if (t === String(beat.n).toLowerCase() || t === String(beat.id).toLowerCase()) return true;
    return (beat.tags || []).some(function (bt) { return String(label(bt)).toLowerCase() === t; });
  }

  /* Words this beat leans on that the rest of the running order does not. The
     document-frequency cut is what keeps "column" and "table" — true of every
     beat in this talk — from making everything look relevant. */
  function keywords(beat, beats) {
    var list = beats && beats.length ? beats : (beat ? [beat] : []);
    var df = {}, ceiling = Math.max(1, Math.round(list.length * COMMON));
    list.forEach(function (b) {
      Object.keys(set(tokens(beatText(b)))).forEach(function (w) { df[w] = (df[w] || 0) + 1; });
    });
    var keep = {};
    Object.keys(set(tokens(beatText(beat)))).forEach(function (w) {
      if ((df[w] || 0) <= ceiling) keep[w] = true;
    });
    return keep;
  }

  function relevance(item, beat, beats, keep) {
    if (!beat) return 0;
    var text = itemText(item), score = 0;
    (item.tags || []).forEach(function (t) { if (tagHit(t, beat)) score += 4; });
    cols(beat).forEach(function (c) { if (colHit(text, c)) score += 3; });
    var hits = 0;
    keep = keep || keywords(beat, beats);
    Object.keys(set(tokens(text))).forEach(function (w) { if (keep[w]) hits++; });
    return score + Math.min(3, hits);
  }

  /* Related first, then whatever has actually been asked most, then the order
     they were written in. A stable sort so the list does not shuffle under the
     speaker's eyes between two presses of the same key. */
  function rank(items, beat, beats) {
    /* One document-frequency pass for the whole list. Per item it was the
       whole running order tokenised once per question, on a path that reruns
       on every keystroke in the search box — while the speaker is talking. */
    var keep = beat ? keywords(beat, beats) : {};
    return (items || []).map(function (item, i) {
      var score = relevance(item, beat, beats, keep);
      return {
        item: item, index: i, score: score, related: score >= RELATED,
        asked: ((item && item.askedIn) || []).length
      };
    }).sort(function (a, b) {
      return (b.score - a.score) || (b.asked - a.asked) || (a.index - b.index);
    });
  }

  function search(rows, query) {
    var q = String(query || '').trim().toLowerCase();
    if (!q) return rows;
    return rows.filter(function (r) { return itemText(r.item).toLowerCase().indexOf(q) >= 0; });
  }

  /* Which beat introduces this term — the glossary's other job, and the reason
     a term entry can tell you "you explain this at 03". */
  function firstUsedIn(term, beats) {
    var needle = String((term && term.term) || term || '').toLowerCase();
    if (!needle) return null;
    var hit = null;
    (beats || []).some(function (b) {
      if ((beatText(b) + ' ' + U.textOf(b.script)).toLowerCase().indexOf(needle) >= 0) { hit = b; return true; }
      return false;
    });
    return hit;
  }

  /* The mark M writes back: which room asked it, and when. Next time it sorts
     higher — the drawer gets more right the more it is used. */
  function stamp(production, when) {
    var d = when || new Date();
    var occasion = (production && (production.occasion || production.title)) || '这一场';
    return occasion + ' · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function mark(item, text) {
    if (!item) return false;
    item.askedIn = item.askedIn || [];
    if (item.askedIn.indexOf(text) >= 0) return false;
    item.askedIn.push(text);
    return true;
  }

  return {
    RELATED: RELATED, tokens: tokens, beatText: beatText, itemText: itemText,
    cols: cols, colHit: colHit, keywords: keywords, relevance: relevance, rank: rank,
    search: search, firstUsedIn: firstUsedIn, stamp: stamp, mark: mark, label: label
  };
})();

/* ------------------------------------------------------------------ layer */
U.stage.define({
  id: 'drawer',
  hints: [
    { key: 'ArrowUp', label: '选', order: 10 },
    { key: 'ArrowDown', label: '选', order: 11 },
    { key: 'ArrowLeft', label: '切标签', order: 20 },
    { key: 'ArrowRight', label: '切标签', order: 21 },
    { key: '/', label: '搜', order: 30 },
    { key: 'm', label: '标记被问到', order: 40 },
    { key: 'Escape', label: '关', order: 50 }
  ],
  mount: function (root) {
    var TABS = [
      { id: 'qa', label: '可能被问', list: function (p) { return (p && p.qa) || []; } },
      { id: 'terms', label: '术语', list: function (p) { return (p && p.terms) || []; } },
      { id: 'fallbacks', label: '备用说法', list: function (p) { return (p && p.fallbacks) || []; } }
    ];
    var tab = 0, pick = 0, query = '', rows = [];

    var tabsEl = U.el('div', { class: 'u-drawer__tabs' });
    var input = U.el('input', {
      class: 'u-mono u-drawer__input', type: 'text', placeholder: '输入就筛 · 中英都行',
      oninput: function () { query = input.value; pick = 0; paint(); },
      onkeydown: function (e) {
        if (e.key === 'Escape') { e.stopPropagation(); query = ''; input.value = ''; input.blur(); paint(); }
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      }
    });
    var list = U.el('div', { class: 'u-drawer__list' });
    var detail = U.el('div', { class: 'u-drawer__detail' });

    root.appendChild(U.el('div', { class: 'u-drawer' }, [
      U.el('div', { class: 'u-drawer__bar' }, [
        tabsEl,
        U.el('div', { style: { flex: '1' } }),
        U.el('label', { class: 'u-drawer__search' }, [U.stage.chip('/'), input])
      ]),
      U.el('div', { class: 'u-drawer__body' }, [list, detail]),
      U.stage.footer('drawer', [
        U.el('span', { class: 'u-lbl' }, '弹药库'),
        U.el('span', { class: 'u-mono u-stage__footnote' }, '时钟不会被盖住 —— 抽屉只从顶栏以下升起')
      ])
    ]));

    function current() { return rows[pick] || null; }

    function paint() {
      var p = U.store.production(), beat = U.store.beat(), beats = U.store.beats();
      rows = U.drawer.search(U.drawer.rank(TABS[tab].list(p), beat, beats), query);
      if (pick >= rows.length) pick = Math.max(0, rows.length - 1);

      U.clear(tabsEl);
      TABS.forEach(function (t, i) {
        tabsEl.appendChild(U.el('button', {
          class: 'u-lbl u-drawer__tab' + (i === tab ? ' is-on' : ''), 'aria-pressed': String(i === tab),
          onclick: function () { tab = i; pick = 0; paint(); }
        }, [t.label, U.el('span', { class: 'u-drawer__count' }, String(t.list(p).length))]));
      });

      U.clear(list);
      rows.forEach(function (r, i) {
        var it = r.item;
        var title = it.q != null ? U.textOf(it.q) : it.term != null ? it.term : it.when;
        var side = it.askedIn && it.askedIn.length ? '问过 ' + it.askedIn.length + ' 次' : '';
        list.appendChild(U.el('div', {
          class: 'u-drawer__row' + (i === pick ? ' is-on' : ''),
          onclick: function () { pick = i; paint(); }
        }, [
          U.el('span', { class: 'u-drawer__dot' + (r.related ? ' is-related' : '') }),
          U.el('span', { class: 'u-drawer__q', text: title }),
          side ? U.el('span', { class: 'u-mono u-drawer__asked', text: side }) : null
        ]));
      });
      list.appendChild(U.el('div', { class: 'u-drawer__legend' }, [
        U.el('span', { class: 'u-drawer__dot is-related' }),
        U.el('span', { class: 'u-mono', text: '= 和当前这节相关，自动排前面' })
      ]));

      paintDetail(beat, beats);
      var on = list.querySelector('.is-on');
      if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
    }

    function paintDetail(beat, beats) {
