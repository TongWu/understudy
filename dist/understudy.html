/* ==== js/22-panic.js ==== */
'use strict';
/* 卡壳保险 — the ↓ key. The only reason to open a script on stage is that you
   have lost your place, so this does not open at the top: it opens at the
   paragraph you are probably in, worked out from the clock.

   The estimate is printed on the screen in full — 本节已用 1:12 / 2:30 →
   稿子 48% 处 — because something that is guessing should say so, and because
   a speaker who can see the arithmetic can correct it in one keystroke rather
   than losing faith in the whole screen. */

U.panic = (function () {
  /* Paragraphs, kept as authored. No DOM here: the split has to work under
     node so it can be tested away from a browser. */
  function split(html) {
    var s = String(html == null ? '' : html);
    var parts = s.indexOf('<p') >= 0
      ? s.split(/<\/p\s*>/i).map(function (chunk) { return chunk.replace(/^[\s\S]*?<p[^>]*>/i, ''); })
      : s.split(/\n{2,}/);
    return parts.map(function (chunk) {
      return { html: chunk.trim(), text: U.textOf(chunk).trim() };
    }).filter(function (p) { return p.text.length > 0; });
  }
  /* Weighted by how long each paragraph takes to say, not by how long it looks
     — a line of Chinese and a line of English of the same width are not the
     same number of seconds. */
  function weights(parts, rate) {
    return parts.map(function (p) { return Math.max(0.001, U.estimate(p.html, rate)); });
  }
  function locate(parts, fraction, rate) {
    if (!parts || !parts.length) return 0;
    var w = weights(parts, rate);
    var total = w.reduce(function (a, b) { return a + b; }, 0);
    var goal = Math.max(0, Math.min(1, Number(fraction) || 0)) * total;
    var acc = 0;
    for (var i = 0; i < w.length; i++) {
      acc += w[i];
      if (goal < acc) return i;
    }
    return w.length - 1;
  }
  return { split: split, weights: weights, locate: locate };
})();

U.stage.define({
  id: 'panic',
  hints: [
    { key: 'ArrowUp', label: '微调', order: 10 },
    { key: 'ArrowDown', label: '微调', order: 11 },
    { key: 'Escape', label: '回提词卡', order: 20 },
    { key: 'q', label: '弹药库', order: 30 }
  ],
  mount: function (root) {
    var nudge = 0, at = -1, was = -1, parts = [], nodes = [];

    var sum = U.el('span', { class: 'u-mono u-panic__sum' });
    var tweak = U.el('span', { class: 'u-mono u-panic__tweak' });
    var dot = U.el('div', { class: 'u-panic__dot' });
    var rail = U.el('div', { class: 'u-panic__rail' }, [dot]);
    var body = U.el('div', { class: 'u-read u-panic__script' });

    root.appendChild(U.el('div', { class: 'u-panic' }, [
      U.el('div', { class: 'u-panic__bar' }, [
        U.el('span', { class: 'u-pill u-pill--tight' }, '卡壳保险'),
        U.el('span', { class: 'u-panic__hint' }, [
          U.el('span', { text: '按用时估的位置，可能差一两句 —— ' }),
          U.stage.chip('ArrowUp'), U.stage.chip('ArrowDown'),
          U.el('span', { text: ' 微调' })
        ]),
        tweak,
        U.el('div', { style: { flex: '1' } }),
        sum
      ]),
      U.el('div', { class: 'u-panic__body' }, [rail, body]),
      U.stage.footer('panic', [
        U.el('span', { class: 'u-lbl' }, '你大概讲到这里'),
        U.el('span', { class: 'u-mono u-stage__footnote' }, '高亮那段就是估的位置')
      ])
    ]));

    function build(beat) {
      parts = U.panic.split(beat && beat.script);
      U.clear(body);
      nodes = parts.map(function (p) {
        var el = U.el('p', { class: 'u-panic__p', html: p.html });
        body.appendChild(el);
        return el;
      });
      if (!parts.length) body.appendChild(U.el('p', { class: 'u-panic__p is-empty', text: '这一节还没有讲稿。' }));
    }

    function paint() {
      var beat = U.store.beat(), run = U.run.current();
      if (at !== U.store.get().ui.beatIndex) { at = U.store.get().ui.beatIndex; nudge = 0; was = -1; build(beat); }

      var f = U.run.scriptFraction ? U.run.scriptFraction() : 0;
      var guess = U.panic.locate(parts, f, U.store.rate());
      var here = Math.max(0, Math.min(Math.max(0, parts.length - 1), guess + nudge));
      nudge = here - guess;                  /* so holding ↑ at the top does not bank offsets */
      nodes.forEach(function (el, i) {
        el.className = 'u-panic__p' + (i === here ? ' is-here' : i < here ? ' is-past' : '');
      });
      var spent = run && run.perBeat[at] ? run.perBeat[at].spent : 0;
      var budget = (beat && Number(beat.budget)) || 0;
      sum.textContent = '本节已用 ' + U.fmt(spent) + ' / ' + U.fmt(budget) +
        ' → 稿子 ' + Math.round(f * 100) + '% 处';
      tweak.textContent = nudge ? (nudge > 0 ? '往后 ' + nudge + ' 段' : '往前 ' + (-nudge) + ' 段') : '';
      dot.style.top = (parts.length ? (here + 0.5) / parts.length * 100 : 50).toFixed(1) + '%';
      /* Only chase the estimate when it actually moves — a page that scrolls
         under you once a second is unreadable. */
      var el = nodes[here];
      if (here !== was && el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
      was = here;
    }

    paint();
    return {
      update: paint,
      keys: {
        ArrowUp: function () { nudge--; paint(); },
        ArrowDown: function () { nudge++; paint(); }
      }
    };
  }
});

/* ==== js/23-squeeze.js ==== */
'use strict';
/* 只剩 N 分钟 — the T key. Somebody at the back holds up three fingers; this
   turns that into a plan for the beats you have not given yet.

   The arithmetic is U.squeeze(): importance 3 barely moves, 2 gives up a
   third, 1 goes whole. What this screen adds is the part a speaker actually
   needs before they dare press it — 连带: what nobody will say once a beat is
   dropped, and the one line to put back so it is not simply lost. A tool that
   only subtracts is a tool you do not touch while people are watching. */

U.reflow = (function () {
  var WORD = { 1: '低', 2: '中', 3: '高' };

  function importance(beat) {
    var n = Number(beat && beat.importance) || 2;
    return Math.max(1, Math.min(3, n));
  }
  function importanceWord(beat) { return WORD[importance(beat)]; }

  function plan(beats, seconds) {
    var rows = U.squeeze(beats || [], Math.max(0, Number(seconds) || 0));
    var from = rows.reduce(function (a, r) { return a + r.from; }, 0);
    var to = rows.reduce(function (a, r) { return a + r.to; }, 0);
    return { rows: rows, from: from, to: to, cut: from - to, seconds: seconds };
  }

  /* Said in terms of the cue card, because that is what the speaker will be
     looking at when the cut has to happen. */
  function how(row) {
    if (!row) return '';
    if (row.skip) return '整节跳过';
    var cues = (row.beat.cue || []).length;
    if (!row.from || row.to >= row.from) return '照原样讲';
    var ratio = row.to / row.from;
    if (ratio >= 0.9) return '几乎不动 —— 只压掉 ' + U.fmt(row.from - row.to);
    if (!cues) return '压到 ' + U.fmt(row.to) + '，讲要点就走';
    var keep = Math.max(1, Math.round(cues * ratio));
    return '讲前 ' + keep + ' 条提词，其余 ' + (cues - keep) + ' 条带过';
  }

  function firstSay(beat) {
    var line = '';
    ((beat && beat.cue) || []).some(function (c) {
      var say = (c.say || [])[0];
      if (say) { line = U.textOf(say).trim(); return true; }
      return false;
    });
    if (!line) {
      var text = U.textOf((beat && beat.script) || '').trim();
      var m = /^[\s\S]*?[.。?？!！]/.exec(text);      /* no lookbehind: this ships to Safari too */
      line = ((m && m[0]) || text).trim();
    }
    /* the authored line usually carries its own quotes; the screen adds a pair
       of its own, and two sets of quotes read as a typo */
    return line.replace(/^["“”']+/, '').replace(/["“”']+$/, '').trim();
  }
  function leads(beat) {
    return ((beat && beat.cue) || []).map(function (c) { return U.textOf(c.lead).trim(); })
      .filter(Boolean);
  }

  /* What a dropped beat takes with it, and where the make-up line goes: the
     first beat that survives after it, because that is the next time you will
     have the room's attention. */
  function knockOn(rows) {
    var out = [];
    (rows || []).forEach(function (row, i) {
      if (!row.skip) return;
      var into = null;
      for (var j = i + 1; j < rows.length; j++) if (!rows[j].skip) { into = rows[j].beat; break; }
      if (!into) for (var k = i - 1; k >= 0; k--) if (!rows[k].skip) { into = rows[k].beat; break; }
      out.push({
        beat: row.beat, missing: leads(row.beat).slice(0, 2),
        more: Math.max(0, leads(row.beat).length - 2),
        line: firstSay(row.beat), into: into
      });
    });
    return out;
  }

  /* The make-up line, as a cue item, so adopting a plan puts it where it will
     actually be read rather than in a note nobody opens. */
  function makeUpCue(hit) {
    return {
      flag: 'SAY', cols: [],
      lead: '<b>补回 ' + U.esc(hit.beat.n) + '</b> —— ' + U.esc(hit.missing[0] || hit.beat.title),
      say: hit.line ? [U.esc(hit.line)] : [],
      notes: ['这句是跳过 ' + hit.beat.n + ' 之后补的'],
      madeUpFor: hit.beat.id
    };
  }

  function adopt(rows, opts) {
    opts = opts || {};
    var hits = opts.skip === false ? [] : knockOn(rows);
    U.store.update(function () {
      rows.forEach(function (r) {
        if (r.beat.budgetWas == null) r.beat.budgetWas = r.from;
        if (opts.skip === false) { r.beat.budget = Math.max(r.to, 1); return; }
        r.beat.budget = r.to;
        if (r.skip) r.beat.skipped = true;
      });
      hits.forEach(function (hit) {
        if (!hit.into || !hit.line) return;
        hit.into.cue = (hit.into.cue || []).filter(function (c) { return c.madeUpFor !== hit.beat.id; });
        hit.into.cue.push(makeUpCue(hit));
      });
    });
    return hits;
  }

  return {
    importance: importance, importanceWord: importanceWord, plan: plan, how: how,
    knockOn: knockOn, leads: leads, firstSay: firstSay, adopt: adopt, makeUpCue: makeUpCue
  };
})();

'use strict';
/* 双屏演讲者视图 — the laptop screen while the room sees the slide.

   The thing worth defending here is the corner that never changes: the first
   sentence of the NEXT beat, always on screen. Changing beat is where people
   dry up, and the fix is not a bigger script — it is one sentence, already

'use strict';
/* 排练设置 —— 难度是一个梯度，不是四个功能。

   每一级用「看得到 / 按键才出来 / 藏起来」三种标签直接画出来：四行标签比四行
   说明文字快得多，而且四级之间的差别一眼就能对齐着看。难度写进 run.difficulty，
   台上模块据此决定提词卡显示什么，复盘据此决定这次能跟谁比 —— 不同难度之间
   「快了 39 秒」不是进步，是换了张难度不同的卷子。 */

U.rehearsal = (function () {

  var SHOWN = 'shown', KEY = 'key', HIDDEN = 'hidden';

  /* 台本顺序 · 提词 · 讲稿 · 打断 —— 一级比一级少给你看一样东西。
     提词永远看得到：它是台上唯一会看的东西，藏了就不是排练是背诵。 */
  var LEVELS = [
    { id: 1, name: '照读',     desc: '讲稿全文摊开，先顺一遍嘴',           when: '刚写完的时候',
      order: SHOWN,  cue: SHOWN, script: SHOWN, interrupt: false },
    { id: 2, name: '只看提词', desc: '讲稿收起来，要按 ↓ 才出来',          when: '稿子基本记住了',
      order: SHOWN,  cue: SHOWN, script: KEY,   interrupt: false },
    { id: 3, name: '冷启动',   desc: '台本顺序也藏起来，测你记不记得结构', when: '上台前两三天',
      order: HIDDEN, cue: SHOWN, script: KEY,   interrupt: false },
    { id: 4, name: '有人打断', desc: '冷启动 + 随机弹 2 个弹药库里的问题', when: '上台前最后一遍',
      order: HIDDEN, cue: SHOWN, script: KEY,   interrupt: true }
  ];

  function level(id) {
    for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].id === Number(id)) return LEVELS[i];
    return LEVELS[0];
  }
  function levelName(id) { return level(id).name; }

  /* 这一场里可比的：同难度。复盘和这一屏底部都用它。 */
  function sameDifficulty(runs, difficulty) {
    return (runs || []).filter(function (r) { return (r.difficulty || 1) === Number(difficulty); });
  }

  /* 上一次是几级，就默认再上一级 —— 梯度是拿来爬的。 */
  function suggested(runs) {
    var last = (runs || [])[(runs || []).length - 1];
    return last ? Math.min(4, (last.difficulty || 1) + 1) : 1;
  }

  /* 这次相对前几次难还是易，写成一句人话。数字本身不会告诉你它不可比。 */
  function stance(difficulty, recent) {
    var name = levelName(difficulty), n = recent.length;
    if (!n) return '这次是 ' + name + ' —— 第一次排，之后的复盘只会拿它跟同难度比。';
    var same = sameDifficulty(recent, difficulty).length;
    var harder = recent.filter(function (r) { return (r.difficulty || 1) < difficulty; }).length;
    var easier = recent.filter(function (r) { return (r.difficulty || 1) > difficulty; }).length;
    if (same === n) return '这次跟前 ' + n + ' 次一样是 ' + name + ' —— 可以直接比。';
    if (harder === n) return '这次是 ' + name + '，比前 ' + n + ' 次都难 —— 慢一点是正常的，复盘只会拿它跟同难度比。';
    if (easier === n) return '这次是 ' + name + '，比前 ' + n + ' 次都容易 —— 快是应该的，复盘只会拿它跟同难度比。';
    return '这次是 ' + name + '，前 ' + n + ' 次里有 ' + same + ' 次同难度 —— 复盘只会拿它跟那 ' + same + ' 次比。';
  }

  /* 上一次哪几节超了 —— 「只练超时的几节」用它，复盘的建议也用它。 */
  function overran(run, beats) {
    if (!run) return [];
    return (beats || []).filter(function (b, i) {
      var slot = (run.perBeat || [])[i];
      return slot && slot.spent > (Number(b.budget) || 0);
    });
  }

  /* ---------- 键位提示条：绑了什么就印什么，三块屏共用 ---------- */
  var KEYCAP = { Enter: '⏎', Space: '空格', ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Escape: 'Esc' };
  function keybar(view) {
    var hints = U.keys.hints(view);
    if (!hints.length) return null;
    return U.el('div', { class: 'u-reh__keys' }, hints.map(function (h) {
      return U.el('span', { class: 'u-reh__key' }, [
        U.el('kbd', { class: 'u-mono u-reh__cap', text: KEYCAP[h.key] || h.key }),
        U.el('span', { text: h.label })
      ]);
    }));
  }

  return {
    LEVELS: LEVELS, level: level, levelName: levelName,
    sameDifficulty: sameDifficulty, suggested: suggested, stance: stance,
    overran: overran, keybar: keybar
  };
})();

(function () {

  var body = null;

        }, [
          toggle(s.recording),
          U.el('span', { class: 'u-reh__rectext' }, [
            U.el('span', { class: 'u-reh__recline', text: s.recording ? '开着，按节自动切分' : '关着，这次不录' }),
            U.el('span', { class: 'u-mono u-reh__recnote', text: '只存在这台设备上，不上传' })
          ])
        ]),

          })
        ])

      U.el('div', { class: 'u-reh__group' }, [

        U.el('div', { class: 'u-reh__chips' }, [

          chip(U.fmt(budget) + ' 预算', s.target === 'budget', function () { pick.target = 'budget'; paint(); })
        ])
      ]),
      U.el('div', { class: 'u-reh__group' }, [
        U.el('span', { class: 'u-lbl u-reh__lbl', text: '练哪些' }),
        U.el('div', { class: 'u-reh__chips' }, [
          chip('全场 ' + beats.length + ' 节', s.scope === 'all', function () { pick.scope = 'all'; paint(); }),
          chip(onlyBeat ? '只练 ' + onlyBeat.n : '只练一节', s.scope === 'one', function () { pick.scope = 'one'; paint(); }, !onlyBeat),
          chip(overs.length ? '超时的 ' + overs.length + ' 节' : '上次没有超时的节', s.scope === 'over',
            function () { pick.scope = 'over'; paint(); }, !overs.length)
        ])
      ]),
      U.el('button', {
        class: 'u-btn u-btn--primary u-reh__go', onclick: begin,

    body.appendChild(U.el('div', { class: 'u-reh__grid' }, [levels, side]));

    var foot = U.el('div', { class: 'u-reh__foot' }, [U.el('span', { class: 'u-lbl', text: recent.length ? '前 ' + recent.length + ' 次' : '还没排过' })]);

        U.el('span', { class: 'u-mono u-reh__prevt', text: U.fmt(r.total) }),
        U.el('span', { class: 'u-pill', text: R.levelName(r.difficulty) })
      ]));
    });
    foot.appendChild(U.el('div', { style: { flex: '1' } }));
    foot.appendChild(U.el('span', { class: 'u-reh__stance', text: R.stance(s.difficulty, recent) }));
    body.appendChild(foot);

    var keys = R.keybar('rehearsal');
    if (keys) body.appendChild(keys);
  }

  U.keys.bind('rehearsal', 'Enter', '开始排练', function () { begin(); }, 10);
  U.keys.bind('rehearsal', 'ArrowDown', '难度 +', function () { ensure().difficulty = Math.min(4, pick.difficulty + 1); paint(); }, 20);
  U.keys.bind('rehearsal', 'ArrowUp', '难度 −', function () { ensure().difficulty = Math.max(1, pick.difficulty - 1); paint(); }, 21);
  U.keys.bind('rehearsal', 'r', '录音开关', function () { ensure().recording = !pick.recording; paint(); }, 30);

  U.views.register('rehearsal', {
    mount: function (root) {
      var runs = (U.store.production() || {}).runs || [];
      pick = defaults();
      root.appendChild(U.el('div', { class: 'u-reh__page' }, [
        U.chrome.topbar({ crumb: '排练 · 第 ' + (runs.length + 1) + ' 次' }),
        (body = U.el('div', { class: 'u-reh__body u-reh' }))
      ]));
      paint();
    },
    update: function () { paint(); }
  });
})();

/* ==== js/31-recap.js ==== */
'use strict';
/* 排练复盘 —— 时间是从哪一节漏出去的。

   主图是两条轨道共用一个 px/秒刻度、都左对齐于 0：只有这样，「计划到这里的时候
   实际才走到那里」才是看出来的，不是算出来的。几何全部是纯函数（U.recap.*），
   因为图表最容易错的地方是算术，而算术是可以在 node 里测的。

   同难度才横向比。样例里第 3 次是「只看提词」，前两次是「照读」—— 那个
   「快了 39 秒」是换了张卷子，不是进步，界面必须说出来。 */

U.recap = (function () {

  var GAP = 2;        /* 段与段之间留底色的缝，而不是画边框 */
  var SPLIT = 1.5;    /* 一节内部「预算内 / 超出」之间的发丝缝 */

  function num(v) { return Number(v) || 0; }
  function budgetOf(b) { return num(b && b.budget); }

  /* ---------- 一次 run 的逐节数字 ---------- */
  function beatRows(run, beats) {
    var per = (run && run.perBeat) || [];
    var byId = {}, keyed = false;
    per.forEach(function (s) { if (s && s.beat) { byId[s.beat] = s; keyed = true; } });
    /* 对得上 id 就按 id 对 —— 只在整份记录都没有 id 时才退回按位置。
       半对半错地混着来，只会让某一节悄悄顶替另一节的数字。 */
    return (beats || []).map(function (b, i) {
      var slot = keyed ? (byId[b.id] || null) : (per[i] || null);
      var spent = slot ? num(slot.spent) : 0;
      var budget = budgetOf(b);
      return {
        i: i, id: b.id, n: b.n, title: b.nav || b.title || b.id,
        budget: budget, spent: spent, delta: spent - budget,
        over: spent > budget,
        /* 「讲到了」= 真的花过时间。U.run.start 会给每一节都开一个 0 秒的格子，
           所以格子在不代表这一节讲过 —— 认格子的话，没走到的节会以「比预算快
           1:30」的身份进复盘。 */
        ran: !!slot && spent > 0
      };
    });
  }

  /* ---------- 一条轨道 ----------
     items: [{id, n, seconds, budget?}]。budget 给了且超了，就把这一段切成
     「预算内」和「超出」两块。x 直接由累计秒数乘刻度算出，所以两条轨道的
     px/秒必然相同 —— 这不是约定，是构造出来的。 */
  function lane(items, scale, gap) {
    var g = gap == null ? GAP : gap, cum = 0;
    return (items || []).map(function (it) {
      var sec = num(it.seconds);
      var x = cum * scale;
      /* 没讲到的一节不是一根 1px 的小条，是什么都没有 —— 画个小条会让人以为
         那里发生过什么。 */
      var w = sec > 0 ? Math.max(1, sec * scale - g) : 0;
      var seg = { id: it.id, n: it.n, seconds: sec, budget: it.budget, x: x, w: w, at: cum, empty: sec <= 0 };
      if (it.budget != null && sec > num(it.budget) && w - SPLIT - 1 >= 1) {
        var over = (sec - num(it.budget)) * scale;
        over = Math.max(1, Math.min(over, w - SPLIT - 1));
        seg.base = { x: x, w: w - over - SPLIT };
        seg.over = { x: x + (w - over - SPLIT) + SPLIT, w: over };
      }
      cum += sec;
      return seg;
    });
  }

  function totals(run, beats) {
    var rows = beatRows(run, beats);
    return {
      plan: rows.reduce(function (a, r) { return a + r.budget; }, 0),
      actual: rows.reduce(function (a, r) { return a + r.spent; }, 0),
      rows: rows
    };
  }

  /* ---------- 计划 / 实际 双轨 ---------- */
  function timeline(run, beats, opts) {
    opts = opts || {};
    var width = num(opts.width) || 1176;
    var gap = opts.gap == null ? GAP : opts.gap;
    var t = totals(run, beats);
    var target = num(opts.target);
    var extra = (opts.also || []).map(function (r) { return totals(r, beats).actual; });
    var span = Math.max.apply(null, [t.plan, t.actual, target, 1].concat(extra));
    var scale = width / span;

    var plan = lane(t.rows.map(function (r) { return { id: r.id, n: r.n, seconds: r.budget }; }), scale, gap);
    var actual = lane(t.rows.map(function (r) { return { id: r.id, n: r.n, seconds: r.spent, budget: r.budget }; }), scale, gap);

    var ticks = [];
    for (var m = 0; m * 60 <= span; m++) ticks.push({ minute: m, x: m * 60 * scale, label: m + '′' });

    return {
      width: width, span: span, scale: scale, gap: gap,
      planTotal: t.plan, actualTotal: t.actual, rows: t.rows,
      plan: plan, actual: actual, ticks: ticks,
      target: target ? { seconds: target, x: target * scale } : null
    };
  }

  /* 对比模式：同一把尺子上叠几次 run，每条轨道都要标出自己的难度。 */
  function laneFor(run, beats, scale, gap) {
    var rows = beatRows(run, beats);
    return lane(rows.map(function (r) { return { id: r.id, n: r.n, seconds: r.spent, budget: r.budget }; }), scale, gap);
  }

  /* ---------- 只跟同难度比 ---------- */
  function sameDifficulty(runs, difficulty) {
    return (runs || []).filter(function (r) { return (r.difficulty || 1) === Number(difficulty); });
  }
  /* 这次之前、同难度的那一次。没有就是没有 —— 不要拿隔壁难度凑数。 */
  function previousSame(runs, run) {
    var list = runs || [], at = list.indexOf(run);
    if (at < 0) at = list.length;
    for (var i = at - 1; i >= 0; i--) if ((list[i].difficulty || 1) === (run.difficulty || 1)) return list[i];
    return null;
  }
  function previousAny(runs, run) {
    var list = runs || [], at = list.indexOf(run);
    if (at < 0) at = list.length;
    return at > 0 ? list[at - 1] : null;
  }
  function covered(run, beats) {
    return beatRows(run, beats).filter(function (r) { return r.ran; }).length;
  }
  /* 「比上一次」这一格该说什么。可比就给差值，不可比就说明白为什么。
     两道门：难度要一样，走过的节数也要一样 —— 只练了三节的 3:50 跟走完全场的
     13:12 摆在一起，那个「快了 9:22」是纯粹的假话。 */
  function comparison(runs, run, beats) {
    var same = previousSame(runs, run);
    if (same) {
      if (beats) {
        var mine = covered(run, beats), theirs = covered(same, beats);
        if (mine !== theirs) return {
          comparable: false, other: same, delta: num(run.total) - num(same.total),
          why: '这一遍只走到 ' + mine + ' 节，第 ' + same.n + ' 次走了 ' + theirs + ' 节，比总时长没有意义'
        };
      }
      return { comparable: true, other: same, delta: num(run.total) - num(same.total) };
    }
    var any = previousAny(runs, run);
    if (!any) return { comparable: false, other: null, delta: null, why: '第一次排，还没有可比的' };
    return {
      comparable: false, other: any, delta: num(run.total) - num(any.total),
      why: '上一次是' + (U.rehearsal ? U.rehearsal.levelName(any.difficulty) : String(any.difficulty)) + '，难度不同，不能直接比'
    };
  }

  /* ---------- 三次趋势 ---------- */
  function trend(runs, opts) {
    opts = opts || {};
    var list = (runs || []).slice(-(opts.take || 3));
    var box = { w: num(opts.width) || 300, h: num(opts.height) || 88 };
    var top = opts.top == null ? 16.4 : opts.top, bottom = opts.bottom == null ? 67.6 : opts.bottom;
    var left = opts.left == null ? 34 : opts.left, right = opts.right == null ? 234 : opts.right;
    var target = num(opts.target);
    var vals = list.map(function (r) { return num(r.total); });
    var lo = Math.min.apply(null, vals.concat(target ? [target] : []));
    var hi = Math.max.apply(null, vals.concat(target ? [target] : []));
    function y(v) { return hi === lo ? (top + bottom) / 2 : top + (hi - v) / (hi - lo) * (bottom - top); }
    var step = list.length > 1 ? (right - left) / (list.length - 1) : 0;
    return {
      width: box.w, height: box.h, min: lo, max: hi,
      points: list.map(function (r, i) {
        return { x: left + i * step, y: y(num(r.total)), total: num(r.total), run: r, last: i === list.length - 1 };
      }),
      target: target ? { seconds: target, y: y(target) } : null
    };
  }

  /* ---------- 实测语速：这次讲完的那些节，稿子有多少字 ÷ 实际用了多久 ---------- */
  function measuredRate(run, beats) {
    var rows = beatRows(run, beats), en = 0, zh = 0, secs = 0;
    rows.forEach(function (r, i) {
      if (!r.spent) return;
      var c = U.countWords(U.textOf((beats[i] || {}).script));
      en += c.en; zh += c.zh; secs += r.spent;
    });
    if (!secs) return null;
    return { seconds: secs, words: en, chars: zh, en: en / (secs / 60), zh: zh / (secs / 60) };
  }

  /* ---------- 发现 ---------- */
  function findings(run, runs, beats) {
    var rows = beatRows(run, beats), out = [];
    var overs = rows.filter(function (r) { return r.ran && r.over; });
    var worst = overs.slice().sort(function (a, b) { return b.delta - a.delta; })[0];
    var peers = sameDifficulty(runs, run.difficulty || 1);

    if (worst) {
      var alsoOver = peers.filter(function (r) {
        var rr = beatRows(r, beats)[worst.i];
        return rr && rr.over;
      }).length;
      out.push({
        title: worst.n + ' 超了 ' + Math.round(worst.delta) + ' 秒' +
          (alsoOver > 1 ? ' —— 同难度的 ' + alsoOver + ' 次都超' : ' —— 全场最多的一节'),
        body: alsoOver > 1
          ? '每次都超，问题就不在临场发挥，在稿子。这一节 ' + U.fmt(worst.budget) + ' 的预算里塞了 ' +
            ((beats[worst.i] || {}).cue || []).length + ' 条提词。'
          : '这一节 ' + U.fmt(worst.budget) + ' 的预算里塞了 ' + ((beats[worst.i] || {}).cue || []).length + ' 条提词。'
      });
    }
    var rushed = rows.filter(function (r) { return worst && r.ran && r.i > worst.i && r.delta <= -5; })
      .sort(function (a, b) { return a.delta - b.delta; })[0];
    if (rushed) {
      out.push({
        title: '超时之后你在赶',
        body: rushed.n + ' 比预算快 ' + Math.abs(Math.round(rushed.delta)) + ' 秒 —— 全场压缩最狠的一节。' +
          '压缩是发生了，但它不是你选的，是被前面挤出来的。'
      });
    }
    var steady = rows.filter(function (r) { return r.ran && !r.over && Math.abs(r.delta) <= 5; });
    if (steady.length) {
      out.push({
        title: steady.length + ' 节稳在预算里',
        body: steady.map(function (r) { return r.n; }).join(' · ') + ' 都在正负 5 秒内，不用再练。'
      });
    }
    var missed = rows.filter(function (r) { return !r.ran; });
    if (missed.length) out.unshift({
      title: '这一遍只走到 ' + rows.filter(function (r) { return r.ran; }).length + ' 节',
      body: missed.map(function (r) { return r.n; }).join(' · ') + ' 没讲到，所以下面的数字只说得了走完的那几节。'
    });
    else if (!overs.length) out.unshift({ title: '这一遍没有超时的节', body: '全场每一节都落在预算里 —— 可以升一级难度再排。' });
    return out;
  }

  /* ---------- 建议 ----------
     挪预算不会让演讲变短，只有删词会。这条必须写在建议里，不然「重排预算」
     看起来就像解决了问题。 */
  function advice(run, runs, beats, target, rate) {
    var t = totals(run, beats), rows = t.rows;
    var sum = t.plan || 1;
    var wish = rows.map(function (r) { return r.ran ? r.spent : r.budget; });
    var wsum = wish.reduce(function (a, b) { return a + b; }, 0) || 1;
    var scaled = wish.map(function (v) { return Math.max(5, Math.round(v * sum / wsum / 5) * 5); });
    var moves = rows.map(function (r, i) { return { n: r.n, id: r.id, from: r.budget, to: scaled[i], by: scaled[i] - r.budget }; })
      .filter(function (m) { return m.by !== 0; })
      .sort(function (a, b) { return Math.abs(b.by) - Math.abs(a.by); });
    var overBy = t.actual - num(target);
    var wpm = (rate && rate.en) || U.DEFAULT_RATE.en;
    return {
      moves: moves.slice(0, 4), proposal: scaled, planTotal: sum,
      overTarget: overBy,
      cutWords: overBy > 0 ? Math.round(overBy / 60 * wpm) : 0
    };
  }

  return {
    GAP: GAP, SPLIT: SPLIT,
    beatRows: beatRows, lane: lane, laneFor: laneFor, totals: totals, timeline: timeline,
    sameDifficulty: sameDifficulty, previousSame: previousSame, previousAny: previousAny,
    comparison: comparison, covered: covered, trend: trend, measuredRate: measuredRate,
    findings: findings, advice: advice
  };
})();

/* ================= 视图 ================= */
(function () {
  var R = U.recap;
  var body = null, selected = null, compare = false, drawn = null;

  function prod() { return U.store.production() || { beats: [], runs: [], target: 0 }; }
  function runs() { return prod().runs || []; }
  function current() {
    var list = runs();
    if (selected != null && list[selected]) return list[selected];
    return list[list.length - 1] || null;
  }
  function diffName(d) { return U.rehearsal ? U.rehearsal.levelName(d) : String(d); }

  function svg(markup, cls) { return U.el('span', { class: cls || 'u-reh__ico', html: markup }); }
  var PLAY = '<svg width="11" height="11" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 2.2l8 4.8-8 4.8z" fill="currentColor"></path></svg>';

  function tile(label, main, note, cls) {
    return U.el('div', { class: 'u-card u-rc__tile' + (cls ? ' ' + cls : '') }, [
      U.el('span', { class: 'u-lbl', text: label }), main,
      note ? U.el('span', { class: 'u-mono u-rc__tilenote', text: note }) : null
    ]);
  }

  /* ---------- 主图 ---------- */
  function drawTimeline(host) {
    var p = prod(), run = current();
    if (!run || !host) return;
    var width = host.clientWidth || 1176;
    var also = compare ? runs().slice(-3).filter(function (r) { return r !== run; }) : [];
    var tl = R.timeline(run, p.beats, { width: width, target: p.target, also: also });
    drawn = tl;
    U.clear(host);

    /* 场地时间标注：右对齐到线的左边，不压到刻度。这一行永远在（没有场地时间时
       是空的），因为左边那列的对齐是按它的高度算的。 */
    host.appendChild(U.el('div', { class: 'u-rc__tlab' },
      tl.target ? U.el('span', {
        class: 'u-mono u-rc__tlabtext', style: { width: Math.max(0, tl.target.x - 7) + 'px' },
        text: U.fmt(tl.target.seconds) + ' 场地时间 →'
      }) : null));

    /* 一节 = 一个定位盒子，里面 1~2 块填色。「超出」是这一节内部的一块，
       不是另一节 —— 分成两个平级的段会让这一节在量尺子的时候少掉一截。 */
    function laneEl(segs, kind) {
      var row = U.el('div', { class: 'u-rc__lane' });
      segs.forEach(function (s) {
        if (s.empty) return;
        var fills = s.over
          ? [U.el('div', { class: 'u-rc__fill u-rc__fill--' + kind, style: { left: '0px', width: s.base.w + 'px' } }),
             U.el('div', { class: 'u-rc__fill u-rc__fill--over', style: { left: (s.base.w + R.SPLIT) + 'px', width: s.over.w + 'px' } })]
          : [U.el('div', { class: 'u-rc__fill u-rc__fill--' + kind, style: { left: '0px', width: s.w + 'px' } })];
        row.appendChild(U.el('div', {
          class: 'u-rc__seg u-rc__seg--' + kind, style: { left: s.x + 'px', width: s.w + 'px' },
          'data-seconds': String(s.seconds), 'data-beat': s.id
        }, fills));
        row.appendChild(U.el('div', { class: 'u-mono u-rc__segn u-rc__segn--' + kind, style: { left: (s.x + 4) + 'px' }, text: s.n }));
      });
      return row;
    }

    var stack = U.el('div', { class: 'u-rc__stack' });
    stack.appendChild(laneEl(tl.plan, 'plan'));
    stack.appendChild(laneEl(tl.actual, 'actual'));
    also.forEach(function (r) {
      stack.appendChild(laneEl(R.laneFor(r, p.beats, tl.scale, tl.gap), 'other'));
    });

    var ticks = U.el('div', { class: 'u-rc__ticks' });
    tl.ticks.forEach(function (t) {
      ticks.appendChild(U.el('div', { class: 'u-rc__tick', style: { left: t.x + 'px' } }));
      ticks.appendChild(U.el('div', { class: 'u-mono u-rc__ticklab', style: { left: (t.x + 4) + 'px' }, text: t.label }));
    });
    stack.appendChild(ticks);
    if (tl.target) stack.appendChild(U.el('div', {
      class: 'u-rc__tline',
      style: { left: tl.target.x + 'px', height: (24 * (2 + also.length) + 2 * (1 + also.length)) + 'px' }
    }));
    host.appendChild(stack);
  }

  function timelineCard() {
    var p = prod(), run = current();
    var t = R.totals(run, p.beats);
    var also = compare ? runs().slice(-3).filter(function (r) { return r !== run; }) : [];

    var gutter = U.el('div', { class: 'u-rc__gutter' }, [
      U.el('div', { class: 'u-rc__gut' }, [
        U.el('span', { class: 'u-mono u-rc__gutname', text: '计划' }),
        U.el('span', { class: 'u-mono u-rc__gutval', text: U.fmt(t.plan) })
      ]),
      U.el('div', { class: 'u-rc__gut' }, [
        U.el('span', {
          class: 'u-mono u-rc__gutname u-rc__gutname--on',
          text: compare ? '第 ' + run.n + ' 次 · ' + diffName(run.difficulty) : '实际'
        }),
        U.el('span', { class: 'u-mono u-rc__gutval' + (t.actual > (p.target || t.plan) ? ' u-rc__gutval--over' : ''), text: U.fmt(t.actual) })
      ])
    ]);
    also.forEach(function (r) {
      gutter.appendChild(U.el('div', { class: 'u-rc__gut' }, [
        U.el('span', { class: 'u-mono u-rc__gutname', text: '第 ' + r.n + ' 次 · ' + diffName(r.difficulty) }),
        U.el('span', { class: 'u-mono u-rc__gutval', text: U.fmt(r.total) })
      ]));
    });

    var host = U.el('div', { class: 'u-rc__chart' });
    var card = U.el('div', { class: 'u-card u-rc__tl' }, [
      U.el('div', { class: 'u-rc__tlhead' }, [
        U.el('span', { class: 'u-lbl u-reh__lbl', text: '计划 / 实际 · 同一条时间轴' }),
        U.el('span', { class: 'u-mono u-rc__hint', text: '时间从哪一节开始漏出去的' }),
        U.el('div', { style: { flex: '1' } }),
        U.el('div', { class: 'u-rc__key' }, [
          U.el('span', { class: 'u-rc__kbox u-rc__kbox--plan' }), U.el('span', { class: 'u-mono u-rc__ktext', text: '计划' })
        ]),
        U.el('div', { class: 'u-rc__key' }, [
          U.el('span', { class: 'u-rc__kbox u-rc__kbox--actual' }), U.el('span', { class: 'u-mono u-rc__ktext', text: '实际' })
        ]),
        U.el('div', { class: 'u-rc__key' }, [
          U.el('span', { class: 'u-rc__kbox u-rc__kbox--over' }), U.el('span', { class: 'u-mono u-rc__ktext', text: '超出预算的部分' })
        ]),
        also.length ? U.el('div', { class: 'u-rc__key' }, [
          U.el('span', { class: 'u-rc__kbox u-rc__kbox--other' }), U.el('span', { class: 'u-mono u-rc__ktext', text: '另外几次（左边标着难度）' })
        ]) : null
      ]),
      U.el('div', { class: 'u-rc__tlbody' }, [gutter, host])
    ]);
    return { card: card, host: host };
  }

  /* ---------- 逐节对比 ---------- */
  function beatTable() {
    var p = prod(), run = current();
    var rows = R.beatRows(run, p.beats);
    var maxSec = Math.max.apply(null, rows.map(function (r) { return Math.max(r.budget, r.spent); }).concat([1]));
    var RW = 260, s2 = RW / maxSec;

    var table = U.el('div', { class: 'u-rc__tbl' }, [
      U.el('div', { class: 'u-rc__trow u-rc__trow--head' }, [
        U.el('span', { class: 'u-lbl' }), U.el('span', { class: 'u-lbl', text: '逐节' }),
        U.el('span', { class: 'u-lbl', text: '预算 / 实际' }),
        U.el('span', { class: 'u-lbl u-rc__ra', text: '实际 · 差' }),
        U.el('span', { class: 'u-lbl', text: '录音' })
      ])
    ]);
    rows.forEach(function (r) {
      var bars = U.el('div', { class: 'u-rc__bars' }, [
        U.el('div', { class: 'u-rc__bar u-rc__bar--plan', style: { width: (r.budget * s2) + 'px' } })
      ]);
      if (!r.ran) { /* 没讲到就没有实际那一条 */ }
      else if (r.over) {
        var w = r.spent * s2, ow = Math.max(1, (r.spent - r.budget) * s2);
        bars.appendChild(U.el('div', { class: 'u-rc__barrow' }, [
          U.el('div', { class: 'u-rc__bar u-rc__bar--actual', style: { width: Math.max(1, w - ow - 1.5) + 'px' } }),
          U.el('div', { style: { width: '1.5px' } }),
          U.el('div', { class: 'u-rc__bar u-rc__bar--over', style: { width: ow + 'px' } })
        ]));
      } else {
        bars.appendChild(U.el('div', { class: 'u-rc__bar u-rc__bar--actual', style: { width: (r.spent * s2) + 'px' } }));
      }
      var seg = U.audio && U.audio.segmentFor ? U.audio.segmentFor(r.id) : null;
      table.appendChild(U.el('div', { class: 'u-rc__trow' }, [
        U.el('span', { class: 'u-mono u-rc__tn', text: r.n }),
        U.el('span', { class: 'u-rc__ttitle', text: r.title }),
        bars,
        r.ran
          ? U.el('div', { class: 'u-rc__tdelta' }, [
            U.el('span', { class: 'u-mono u-rc__tspent', text: U.fmt(r.spent) }),
            U.el('span', { class: 'u-mono u-rc__tdiff' + (r.delta > 0 ? ' u-rc__tdiff--over' : ''), text: U.fmtSigned(r.delta) })
          ])
          : U.el('div', { class: 'u-rc__tdelta' }, U.el('span', { class: 'u-mono u-rc__noaudio', text: '这一遍没讲到' })),
        seg
          ? U.el('button', {
            class: 'u-rc__play', title: '放这一节的录音',
            onclick: function () { U.audio.play(r.id, 0); }
          }, [svg(PLAY), U.el('span', { class: 'u-mono u-rc__playlen', text: U.fmt(seg.seconds) })])
          : U.el('span', { class: 'u-mono u-rc__noaudio', text: '没录上' })
      ]));
    });
    return table;
  }

  /* ---------- 趋势 ---------- */
  function trendBlock() {
    var p = prod(), list = runs();
    var tr = R.trend(list, { target: p.target });
    var parts = [];
    if (tr.target) {
      parts.push('<line x1="24" y1="' + tr.target.y.toFixed(1) + '" x2="252" y2="' + tr.target.y.toFixed(1) + '" stroke="var(--over)" stroke-width="1"></line>');
      parts.push('<text x="258" y="' + (tr.target.y + 3.4).toFixed(1) + '" font-family="var(--mono)" font-size="9.5" fill="var(--over)">' + U.fmt(tr.target.seconds) + '</text>');
    }
    parts.push('<polyline points="' + tr.points.map(function (pt) { return pt.x.toFixed(1) + ',' + pt.y.toFixed(1); }).join(' ') +
      '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>');
    tr.points.forEach(function (pt) {
      parts.push('<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="' + (pt.last ? 4.5 : 4) +
        '" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"></circle>');
    });
    var last = tr.points[tr.points.length - 1];
    if (last) parts.push('<text x="' + (last.x + 12).toFixed(1) + '" y="' + (last.y + 3.4).toFixed(1) +
      '" font-family="var(--mono)" font-size="12" font-weight="600" fill="var(--ink)">' + U.fmt(last.total) + '</text>');
    tr.points.forEach(function (pt) {
      parts.push('<text x="' + (pt.x - 10).toFixed(1) + '" y="85" font-family="var(--mono)" font-size="9.5" fill="var(--ink-3)">第 ' + pt.run.n + ' 次</text>');
    });

    var mixed = tr.points.some(function (pt) { return (pt.run.difficulty || 1) !== (tr.points[0].run.difficulty || 1); });
    return U.el('div', { class: 'u-rc__trend' }, [
      U.el('div', { class: 'u-rc__trendhead' }, [
        U.el('span', { class: 'u-lbl u-reh__lbl', text: tr.points.length + ' 次排练' }),
        U.el('span', { class: 'u-mono u-rc__hint', text: '每次都在靠近 ' + U.fmt(p.target) })
      ]),
      U.el('div', {
        class: 'u-rc__trendsvg',
        html: '<svg width="300" height="88" viewBox="0 0 300 88" role="img" aria-label="' +
          tr.points.map(function (pt) { return '第 ' + pt.run.n + ' 次 ' + U.fmt(pt.total); }).join('、') +
          '，场地时间 ' + U.fmt(p.target) + '">' + parts.join('') + '</svg>'
      }),
      U.el('div', { class: 'u-rc__trendlegend' }, tr.points.map(function (pt) {
        return U.el('span', { class: 'u-pill', text: '第 ' + pt.run.n + ' 次 · ' + diffName(pt.run.difficulty) });
      })),
      mixed ? U.el('span', { class: 'u-rc__warn', text: '这几次难度不同 —— 折线是趋势，不是成绩，别当成「越来越快」。' }) : null
    ]);
  }

  /* ---------- 发现与建议 ---------- */
  function adviceBlock() {
    var p = prod(), run = current();
    var a = R.advice(run, runs(), p.beats, p.target, U.store.rate());
    var up = a.moves.filter(function (m) { return m.by > 0; }).slice(0, 2);
    var down = a.moves.filter(function (m) { return m.by < 0; }).slice(0, 2);
    var line = up.length
      ? '按你的实测重排预算：' + up.map(function (m) { return m.n + ' 从 ' + U.fmt(m.from) + ' 改成 ' + U.fmt(m.to); }).join('，') +
        (down.length ? '，从 ' + down.map(function (m) { return m.n; }).join('、') +
          (down.length > 1 ? ' 各收回 ' : ' 收回 ') +
          down.map(function (m) { return Math.abs(m.by) + ' 秒'; }).join('、') : '') + '。'
      : '预算和你的实测已经对得上了，不用挪。';
    return U.el('div', { class: 'u-rc__advice' }, [
      U.el('span', { class: 'u-lbl u-reh__lbl', text: '建议' }),
      U.el('span', { class: 'u-rc__adviceline', text: line }),
      U.el('span', { class: 'u-mono u-rc__hint', text: '预算合计 ' + U.fmt(a.planTotal) + ' 不变，但每节终于对得上你的语速' }),
      U.el('span', {
        class: 'u-rc__honest',
        html: a.overTarget > 0
          ? '<b>挪预算不会让演讲变短，只有删词会。</b>想真的讲进 ' + U.fmt(p.target) + '，还得删掉约 ' +
            Math.round(a.overTarget) + ' 秒的稿子 —— 按你的实测语速大约 ' + a.cutWords + ' 个词。'
          : '<b>挪预算不会让演讲变短，只有删词会。</b>这一遍已经落在 ' + U.fmt(p.target) + ' 之内，稿子不用删。'
      }),
      U.el('div', { class: 'u-rc__acts' }, [
        U.el('button', {
          class: 'u-btn u-btn--primary u-rc__act', text: '按实测重排预算',
          onclick: function () {
            U.store.update(function () {
              (prod().beats || []).forEach(function (b, i) { if (a.proposal[i] != null) b.budget = a.proposal[i]; });
            });
          }
        }),
        up[0] ? U.el('button', {
          class: 'u-btn u-rc__act', text: '只改 ' + up[0].n + ' 的预算',
          onclick: function () {
            U.store.update(function () {
              (prod().beats || []).forEach(function (b) { if (b.id === up[0].id) b.budget = up[0].to; });
            });
          }
        }) : null
      ])
    ]);
  }

  function paint() {
    if (!body) return;
    var p = prod(), list = runs(), run = current();
    U.clear(body);
    if (!run) {
      body.appendChild(U.el('div', { class: 'u-rc__empty' }, [
        U.el('span', { class: 'u-ser u-reh__h1', text: '排练复盘' }),
        U.el('span', { class: 'u-rc__sub', text: '还没有排过 —— 先去排一次，这里才有东西可看。' }),
        U.el('button', { class: 'u-btn u-btn--primary', text: '去排练', onclick: function () { U.views.show('rehearsal'); } })
      ]));
      return;
    }

    var t = R.totals(run, p.beats);
    var cmp = R.comparison(list, run, p.beats);
    var mr = R.measuredRate(run, p.beats);
    var overs = t.rows.filter(function (r) { return r.over; });
    var vsTarget = t.actual - (p.target || 0);

    /* 头 */
    var pills = U.el('div', { class: 'u-rc__pills' });
    list.slice(-3).forEach(function (r) {
      var on = r === run;
      pills.appendChild(U.el('button', {
        class: 'u-pill u-rc__pill' + (on ? ' is-on' : ''), 'aria-pressed': String(on),
        onclick: function () { selected = list.indexOf(r); compare = false; paint(); },
        text: '第 ' + r.n + ' 次 · ' + diffName(r.difficulty)
      }));
    });
    if (list.length > 1) pills.appendChild(U.el('button', {
      class: 'u-pill u-rc__pill' + (compare ? ' is-on' : ''), 'aria-pressed': String(compare),
      onclick: function () { compare = !compare; paint(); }, text: '叠起来看'
    }));

    body.appendChild(U.el('div', { class: 'u-rc__head' }, [
      U.el('div', { class: 'u-rc__title' }, [
        U.el('span', { class: 'u-ser u-reh__h1', text: '排练复盘' }),
        U.el('span', {
          class: 'u-mono u-rc__sub',
          text: '第 ' + run.n + ' 次 · ' + String(run.at || '').replace('T', ' ') + ' · ' + diffName(run.difficulty)
        })
      ]),
      U.el('div', { style: { flex: '1' } }),
      pills
    ]));

    /* 统计条 */
    var hero = U.el('div', { class: 'u-rc__heroval' }, [
      U.el('span', { class: 'u-mono u-rc__hero', text: U.fmt(t.actual) }),
      U.el('div', { class: 'u-rc__herodelta' }, [
        U.el('span', {
          class: 'u-mono u-rc__badge u-rc__badge--' + (vsTarget > 0 ? 'over' : 'go'),
          text: (vsTarget > 0 ? '超 ' : '快 ') + U.fmt(Math.abs(vsTarget))
        }),
        U.el('span', { class: 'u-mono u-rc__heronote', text: '比场地时间 ' + U.fmt(p.target) })
      ])
    ]);
    body.appendChild(U.el('div', { class: 'u-rc__stats' }, [
      tile('全程', hero, null, 'u-rc__tile--hero'),
      tile('超时的节',
        U.el('span', { class: 'u-mono u-rc__stat' }, [String(overs.length), U.el('span', { class: 'u-rc__unit', text: ' 节' })]),
        overs.length ? overs.map(function (r) { return r.n; }).join(' · ') : '一节都没超'),
      tile('比上一次',
        U.el('span', {
          class: 'u-mono u-rc__stat' + (cmp.comparable ? (cmp.delta < 0 ? ' u-rc__stat--go' : ' u-rc__stat--over') : ' u-rc__stat--mute'),
          text: cmp.delta == null ? '—' : U.fmtSigned(cmp.delta)
        }),
        cmp.comparable ? '跟第 ' + cmp.other.n + ' 次比，同是' + diffName(run.difficulty) : cmp.why),
      tile('你的实际语速',
        U.el('span', { class: 'u-mono u-rc__stat' }, [
          mr ? String(Math.round(mr.en)) : '—', U.el('span', { class: 'u-rc__unit', text: ' 词/分' })
        ]),
        mr ? '存进来就用它重算全部估算' : '这一遍没有讲完任何一节')
    ]));

    /* 主图 */
    var tlc = timelineCard();
    body.appendChild(tlc.card);
    drawTimeline(tlc.host);

    /* 下半：逐节 + 发现/建议/趋势 */
    var right = U.el('div', { class: 'u-rc__right' });
    var finds = U.el('div', { class: 'u-rc__finds' }, [U.el('span', { class: 'u-lbl u-reh__lbl', text: '发现' })]);
    R.findings(run, list, p.beats).forEach(function (f) {
      finds.appendChild(U.el('div', { class: 'u-rc__find' }, [
        U.el('span', { class: 'u-rc__findtitle', text: f.title }),
        U.el('span', { class: 'u-rc__findbody', text: f.body })
      ]));
    });
    right.appendChild(finds);
    right.appendChild(adviceBlock());
    right.appendChild(trendBlock());

    body.appendChild(U.el('div', { class: 'u-rc__bottom' }, [beatTable(), right]));

    var keys = U.rehearsal.keybar('recap');
    if (keys) body.appendChild(keys);
  }

  U.keys.bind('recap', 'r', '再排一次', function () { U.views.show('rehearsal'); }, 10);
  U.keys.bind('recap', 'd', '讲后回填', function () { U.views.show('debrief'); }, 20);
  U.keys.bind('recap', 'c', '叠起来看', function () { compare = !compare; paint(); }, 30);

  U.views.register('recap', {
    mount: function (root) {
      selected = null; compare = false;
      root.appendChild(U.el('div', { class: 'u-reh__page' }, [
        U.chrome.topbar({
          crumb: '排练',
          actions: [
            U.el('button', {
              class: 'u-btn', text: '听整场录音',
              onclick: function () { if (U.audio) U.audio.playAll(); }
            }),
            U.el('button', { class: 'u-btn', text: '讲后回填', onclick: function () { U.views.show('debrief'); } }),
            U.el('button', { class: 'u-btn u-btn--primary', text: '再排一次', onclick: function () { U.views.show('rehearsal'); } })
          ]
        }),
        (body = U.el('div', { class: 'u-reh__body u-rc' }))
      ]));
      paint();
      if (typeof window !== 'undefined' && !U.recap._resize) {
        U.recap._resize = true;
        window.addEventListener('resize', function () {
          if (U.store.get().ui.view === 'recap') paint();
        });
      }
    },
    update: function () { paint(); }
  });
})();

/* ==== js/32-audio.js ==== */
'use strict';
/* 录音 —— 只在这台设备上。

   MediaRecorder 跟着 run.beatIndex 走：换节就把当前这段收掉、开一段新的，
   于是每一节天然有一段能独立播放的音频（webm 的后续分片单独拿出来是放不了的，
   所以这里是真的停一次再起一次，不是切 chunk）。

   一条硬规则：音频不出这台设备。不上传、不发第三方、不做转写。波形是录的时候
   用 AnalyserNode 真量出来的振幅，没量到就说没量到 —— 不画假波形骗人。

   还有一条软规则：拿不到麦克风不是错误，是没录上。排练不能因为录音失败而中断，
   所以这里所有的失败都变成一句「这次没录上」，不往外抛。 */

U.audio = (function () {

  var st = {
    state: 'off',          /* off | recording | stopped | unavailable */
    reason: '',
    runId: null,
    stream: null,
    rec: null,
    current: null,         /* {beatId, chunks, startedAt, samples} */
    segments: [],          /* {beat, index, blob, url, seconds, peaks, at} */
    unsub: null,
    ctx: null, analyser: null, meter: null,
    player: null, queue: null
  };

  function supported() {
    return typeof window !== 'undefined' &&
      !!(navigator && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) &&
      typeof window.MediaRecorder === 'function';
  }
  function mime() {
    var want = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < want.length; i++) {
      try { if (window.MediaRecorder.isTypeSupported(want[i])) return want[i]; } catch (e) { /* older impls */ }
    }
    return '';
  }
  function beatIdAt(i) {
    var b = U.store.beats()[i];
    return b ? b.id : null;
  }

  /* ---------- 振幅采样：波形必须是量出来的 ---------- */
  function openMeter(stream) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      st.ctx = new AC();
      var src = st.ctx.createMediaStreamSource(stream);
      st.analyser = st.ctx.createAnalyser();
      st.analyser.fftSize = 1024;
      src.connect(st.analyser);
      var buf = new Uint8Array(st.analyser.fftSize);
      st.meter = setInterval(function () {
        if (!st.analyser || !st.current) return;
        try {
          st.analyser.getByteTimeDomainData(buf);
          var sum = 0;
          for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; sum += v * v; }
          st.current.samples.push(Math.sqrt(sum / buf.length));
        } catch (e) { /* context died mid-take */ }
      }, 100);
    } catch (e) { /* 没有 Web Audio 就没有波形，录音本身照常 */ }
  }
  function closeMeter() {
    if (st.meter) { clearInterval(st.meter); st.meter = null; }
    try { if (st.ctx && st.ctx.close) st.ctx.close(); } catch (e) { /* already closed */ }
    st.ctx = null; st.analyser = null;
  }
  /* 把一串采样压成 n 根柱子，归一到本段自己的最大值 —— 比的是这一节内部的起伏。 */
  function condense(samples, n) {
    if (!samples || !samples.length) return null;
    var out = [], step = samples.length / n, max = 0;
    for (var i = 0; i < n; i++) {
      var a = Math.floor(i * step), b = Math.max(a + 1, Math.floor((i + 1) * step)), peak = 0;
      for (var j = a; j < b && j < samples.length; j++) peak = Math.max(peak, samples[j]);
      out.push(peak); max = Math.max(max, peak);
    }
    return max > 0 ? out.map(function (v) { return v / max; }) : null;
  }

  /* ---------- 一段 ---------- */
  function begin(beatId) {
    if (st.state !== 'recording' || !st.stream) return;
    var chunks = [];
    var take = { beatId: beatId, chunks: chunks, startedAt: Date.now(), samples: [] };
    var rec;
    try {
      var m = mime();
      rec = m ? new window.MediaRecorder(st.stream, { mimeType: m }) : new window.MediaRecorder(st.stream);

       都会让下一次无关的 store 广播误以为「数据变了」而重画 —— 那一下会把
       正在打字的光标冲掉。 */
    sig = signature();
  }

  function signature() {
    var p = prod(), run = session();
    return [U.store.get().ui.view, (p.runs || []).length, (p.qa || []).length,
      run ? run.n : '-', open || '-', (U.audio ? U.audio.segments().length : 0)].join('|');
  }

  U.keys.bind('debrief', 'w', '全部写回弹药库', writeBack, 10);
  U.keys.bind('debrief', 'Escape', '回复盘', function () { U.views.show('recap'); }, 20);

  U.views.register('debrief', {
    mount: function (root) {
      var run = session();
      open = null; picked = {}; fresh = []; ta = null;
      loadDrafts(run);
      root.appendChild(U.el('div', { class: 'u-reh__page' }, [
        U.chrome.topbar({ crumb: '刚才那场' }),
        (body = U.el('div', { class: 'u-reh__body u-db' }))
      ]));
      paint();
      /* 刷新过一次，内存里的段就没了 —— 去 IndexedDB 里把这一场的捞回来。
         捞不到也不说什么，界面本来就写着「没录上」。 */
      if (run && U.audio && !U.audio.segments().length) {
        U.audio.restore(run.n).then(function (list) {
          if (list && list.length) paint();
        });
      }
    },
    /* 只在数据真的变了时重画 —— 不然打字打到一半会被主题开关冲掉。 */
    update: function () {
      var s = signature();
      if (s === sig) return;
      sig = s; paint();
    }
  });
})();

'use strict';
/* 后台 — the shelf every talk sits on, and the first thing the app shows.

   It answers two questions and refuses to answer any others: **will it fit in
   the slot**, and **have you rehearsed it**. There is deliberately no "修改于 3
   天前" column. A talk you touched yesterday and a talk you touched last month
   are the same talk; what differs is whether the script still runs long and
   whether you have said it out loud. Those are the two columns that survived. */
(function () {

  /* ---------- derivations ---------- */

  function parseDate(str) {
    if (!str) return null;
    var d = new Date(String(str));
    return isNaN(d.getTime()) ? null : d;
  }
  /* Whole calendar days, so "还有 4 天" does not flip at lunchtime. */
  function dayDelta(str) {
    var d = parseDate(str);
    if (!d) return null;
    var then = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((then - today) / 86400000);
  }
  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function shortDate(str) {
    var d = parseDate(str);
    return d ? (d.getMonth() + 1) + '月' + d.getDate() + '日' : '日期待定';
  }
  function longDate(str) {
    var d = parseDate(str);
    if (!d) return '日期待定';
    var hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    return shortDate(str) + ' ' + WEEK[d.getDay()] + (hh === '00:00' ? '' : ' ' + hh);
  }
  function countdown(str) {
    var n = dayDelta(str);
    if (n == null) return '日期待定';
    if (n === 0) return '就是今天';
    if (n === 1) return '就在明天';
    if (n > 1) return '还有 ' + n + ' 天';
    if (n === -1) return '昨天讲的';
    return (-n) + ' 天前';
  }
  function ago(str) {
    var n = dayDelta(str);
    if (n == null) return '';
    if (n >= 0) return '今天';
    if (n === -1) return '昨天';
    if (n >= -6) return (-n) + ' 天前';
    if (n >= -13) return '上周';
    if (n >= -30) return Math.round(-n / 7) + ' 周前';
    return shortDate(str);
  }

  var STATUS = {
    draft: { key: 'draft', word: '草稿', color: 'var(--ink-3)' },
    writing: { key: 'writing', word: '在写', color: 'var(--chip)' },
    rehearsing: { key: 'rehearsing', word: '排练中', color: 'var(--tight)' },
    done: { key: 'done', word: '讲过了', color: 'var(--go)' }
  };

  function statusOf(p) {
    var beats = p.beats || [], runs = p.runs || [];
    var delta = dayDelta(p.date);
    if (runs.some(function (r) { return r.mode === 'live'; }) || (delta != null && delta < 0)) return STATUS.done;
    if (runs.length) return STATUS.rehearsing;
    var written = beats.filter(U.io.hasScript).length;
    if (beats.length && written * 2 >= beats.length) return STATUS.writing;
    return STATUS.draft;
  }

  /* 稿齐 / 只有提词 / 空 — the only completeness that matters is whether there
     are words to say, so the script decides and the cue is the consolation. */
  function completeness(p) {
    var out = { full: 0, cueOnly: 0, empty: 0, cells: [] };
    (p.beats || []).forEach(function (b) {
      if (U.io.hasScript(b)) { out.full++; out.cells.push('full'); }
      else if (U.io.hasCue(b)) { out.cueOnly++; out.cells.push('cue'); }
      else { out.empty++; out.cells.push('empty'); }
    });
    return out;
  }

  /* Estimate against the venue slot. A little over is 偏紧; a lot over means
     the script has to lose sentences, and no amount of budget-shuffling helps. */
  function fitOf(p) {
    var t = U.totals(p.beats || [], p.rate || U.DEFAULT_RATE);
    var target = Number(p.target) || 0;
    var tone = 'var(--go)';
    if (!t.estimate) tone = 'var(--ink-3)';
    else if (target && t.estimate > target * 1.05) tone = 'var(--over)';
    else if (target && t.estimate > target) tone = 'var(--tight)';
    return { estimate: t.estimate, target: target, tone: tone, over: target ? t.estimate - target : 0 };
  }

  /* Which beat leaks the time. Ranked by seconds lost across every rehearsal,
     not by how often — one beat that runs 46 seconds long is the problem, five
     that run three seconds long are rounding. */
  function leak(p) {
    var runs = p.runs || [], beats = p.beats || [];

    });

/* ==== js/41-aifill.js ==== */
'use strict';
/* AI 填充 — four steps, because v1 does not call an API.

   The prompt below is not scaffolding to be thrown away when it does. It *is*
   the system prompt: the same words go up to the model the day this screen
   collapses into one button, so tuning it now is banked work, not a detour.
   That is also why it is spelled out on screen instead of hidden — you can read
   it, edit it, and see exactly what is being asked on your behalf. */
(function () {

  var LANG = { en: '英文', zh: '中文', ja: '日文', ko: '韩文', fr: '法文', de: '德文', es: '西班牙文' };
  function langName(code) { return LANG[code] || String(code || '').toUpperCase() || '未定'; }

  function minutes(secs) {
    var s = Number(secs) || 0;
    if (!s) return '（时长待填）';
    return s % 60 === 0 ? (s / 60) + ' 分钟硬性' : U.fmt(s) + ' 硬性';
  }

  /* Everything the model needs to know about the room, pulled from the
     production so the two can never drift apart. */
  function occasionSlots(p) {
    var speak = (p.language && p.language.speak) || 'en';
    var notes = (p.language && p.language.notes) || 'zh';
    var rate = p.rate || U.DEFAULT_RATE;
    var head = [];
    if (p.occasion) head.push(p.occasion);
    head.push(p.title || '未命名');
    /* These land in a string that is written to innerHTML, so the title is
       escaped rather than trusted. Not only for what a title could carry: an
       unescaped < in "budget < 12:00" would silently eat the rest of the line
       out of the prompt you are about to hand to a model. */
    return {
      occasion: U.esc(head.join(' · ')),
      audience: Number(p.audience) ? Number(p.audience) + ' 人' : '（人数待填）',
      duration: minutes(p.target),
      language: speak === notes
        ? U.esc(langName(speak)) + '讲'
        : U.esc(langName(speak)) + '讲；我的母语是' + U.esc(langName(notes)),
      target: String(Number(p.target) || 0),
      pace: speak === 'zh'
        ? '按中文 <b>' + (rate.zh || U.DEFAULT_RATE.zh) + '</b> 字/分'
        : '按' + U.esc(langName(speak)) + ' <b>' + (rate.en || U.DEFAULT_RATE.en) + '</b> 词/分'
    };
  }

  /* Bold is markup, not content — the plain text handed to the model is this
     string with the tags taken out. */
  function promptHtml(p) {
    var s = occasionSlots(p);
    return '你是我的演讲排练助手。把随附的幻灯片做成一份演讲台本。\n' +
      '\n' +
      '<b>【场合】</b>\n' +

'use strict';
/* Getting a talk in and out of the file.

   Export is the product's whole distribution story: the running page *is* the
   application, so a self-contained copy is this document's own markup with the
   production baked into `#embedded-production`. Boot prefers that bake over
   storage, so double-clicking the copy opens that talk and nothing else.

   The validator lives here rather than in 41-aifill because it is the one part
   of the AI round-trip with real rules — beat counts, budgets, the venue slot —
   and rules deserve to be pure functions a test can hammer without a browser. */
U.io = (function () {

  /* ---------- helpers ---------- */

  /* Paragraph-by-paragraph plain text. `U.textOf` flattens a whole script into
     one line; a printed or pasted 台本 needs the breaks back. */
  function blockText(html) {
    return String(html == null ? '' : html)
      .replace(/<\s*br\s*\/?>/gi, '\n')
      .replace(/<\s*\/\s*(p|div|li|h[1-6]|blockquote)\s*>/gi, '\n')
      .split('\n')
      .map(function (chunk) { return U.textOf(chunk).replace(/\s+/g, ' ').trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  function hasScript(beat) { return blockText(beat && beat.script).length > 0; }
  function hasCue(beat) { return !!(beat && beat.cue && beat.cue.length); }

  function label(beat, i) {
    if (beat && beat.n) return String(beat.n);
    return String(i).padStart(2, '0');
  }

  function safeName(title, ext) {
    var base = String(title || 'understudy').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
    return (base || 'understudy') + ext;
  }

  /* A download is the only way out of a file:// page. */
  function download(name, text, mime) {
    if (typeof document === 'undefined') return false;
    var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = U.el('a', { href: url, download: name, style: { display: 'none' } });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 0);
    return true;
  }

  /* ---------- self-contained copy ---------- */

  /* JSON goes inside a <script> element, so the one sequence that could end it
     early has to leave as an escape. `<` never occurs in JSON outside a string,
     where < is exactly equivalent — the parse on the far side is lossless. */
  function bakeable(production) {
    return JSON.stringify(production).replace(/</g, '\\u003c');
  }

  /* A copy for somebody else. The 旁批 are the one thing in this product that
     was promised never to leave — they are what you tell yourself about your
     own performance, and half of them are only writable because nobody else
     will read them. Printing and the plain-text export never carried them;
     the self-contained copy did, because that copy is your workspace. So the
     choice is made explicit rather than made for you: 导出 hands you
     everything, 给别人 hands over the talk with the private layer cut out. */
  function strip(production) {
    var out = JSON.parse(JSON.stringify(production || {}));
    (out.beats || []).forEach(function (b) {
      delete b.notes;
      (b.cue || []).forEach(function (c) { delete c.notes; });

  }

  function exportHtml(opts) {
    opts = opts || {};
    if (typeof document === 'undefined') return '';

    if (!p) return '';
    if (opts.share) p = strip(p);
    /* Written from a copy of the document, never from the document. Two
       reasons, and the second is the one that bites: serialising the live tree
       baked whatever was on screen into the file as static markup underneath
       the real app — the talk written out twice, once as data and once as a
       screen that boot discards on the first paint. Harmless in a working copy
       and fatal in a shared one, because the 旁批 cut out of the JSON were
       still sitting there in the editor's DOM. And doing it on a clone means
       exporting mid-sentence does not disturb the caret you are typing with. */

    return html;
  }

  /* Everything except 旁批. Notes are the one layer written in the speaker's

  function plainText(production) {

    if (p.date) head.push(String(p.date).replace('T', ' '));

          U.el('span', { class: 'u-mono u-print__n', text: label(b, i) }),
          U.el('span', { class: 'u-ser u-print__beat', text: b.title || '' }),
          U.el('span', { class: 'u-mono u-print__budget', text: U.fmt(Number(b.budget) || 0) })
        ])

        })));
      }
      var script = blockText(b.script);
      if (script.length) {
        kids.push(U.el('div', { class: 'u-lbl u-print__lbl', text: '讲稿' }));
        kids.push(U.el('div', { class: 'u-read u-print__script' },
          script.map(function (line) { return U.el('p', { text: line }); })));
      }
      sheets.push(U.el('section', { class: 'u-print__sheet' }, kids));
    });
    return U.el('div', { class: 'u-print', id: 'u-print', 'aria-hidden': 'true' }, sheets);
  }

  function print(opts) {
    if (typeof document === 'undefined' || typeof window === 'undefined') return false;
    opts = opts || {};
    var host = printSheets(opts.production);
    var old = document.getElementById('u-print');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    document.body.appendChild(host);

    /* Ink on paper is paper, whichever desk theme you happen to be sitting in. */
    var wasNight = U.store.get().ui.theme === 'night';
    if (wasNight) U.store.ui({ theme: 'paper' });

    var done = false;
    function restore() {
      if (done) return;
      done = true;
      window.removeEventListener('afterprint', restore);
      if (host.parentNode) host.parentNode.removeChild(host);
      if (wasNight) U.store.ui({ theme: 'night' });
    }
    window.addEventListener('afterprint', restore);
    try { window.print(); } catch (e) { /* a blocked print must not strand the page */ }
    setTimeout(restore, 1500);
    return true;
  }

  /* ---------- import ---------- */

  var IMAGE_RE = /\.(png|jpe?g|gif|webp|avif)$/i;
  var DECK_RE = /\.(pptx?|pdf|key)$/i;

  function readDataUrl(file) {
    return new Promise(function (resolve) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result || '')); };
      fr.onerror = function () { resolve(''); };
      fr.readAsDataURL(file);
    });
  }

  /* A phone photo or a retina screen-grab is several megabytes as a data URL,
     and ten of them do not fit in localStorage at all. Slides are read at slide
     size, so 1600px wide is plenty and costs about a tenth. */
  var MAX_W = 1600, QUALITY = 0.82;
  function downscale(dataUrl) {
    return new Promise(function (resolve) {
      /* Vectors are already small and rasterising one would only lose. */
      if (/^data:image\/svg/.test(dataUrl) || typeof document === 'undefined') return resolve(dataUrl);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h || w <= MAX_W) return resolve(dataUrl);
        var c = document.createElement('canvas');
        c.width = MAX_W; c.height = Math.round(h * MAX_W / w);
        var ctx = c.getContext('2d');
        if (!ctx) return resolve(dataUrl);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        var out = c.toDataURL('image/webp', QUALITY);
        if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', QUALITY);
        resolve(out.length < dataUrl.length ? out : dataUrl);
      };
      img.onerror = function () { resolve(dataUrl); };
      img.src = dataUrl;
    });
  }

  function beatFromImage(name, dataUrl, index) {
    return {
      id: 'b' + Date.now().toString(36) + '-' + index,
      n: String(index).padStart(2, '0'),
      title: String(name || '').replace(/\.[^.]+$/, '') || ('第 ' + (index + 1) + ' 张'),
      nav: '', slideRef: String(name || ''), slideImage: dataUrl,
      budget: 0, importance: 2, tags: [], cue: [], script: '', notes: []
    };
  }

  /* One slide, one beat — the deck already decided where the seams are. Names
     come from the files so the list is recognisable before anything is written. */
  function importImages(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) {
      return (f.type && f.type.indexOf('image/') === 0) || IMAGE_RE.test(f.name || '');
    });
    list.sort(function (a, b) { return String(a.name).localeCompare(String(b.name), undefined, { numeric: true }); });
    if (!list.length) return Promise.resolve({ added: 0, beats: [] });
    return Promise.all(list.map(readDataUrl)).then(function (urls) {
      return Promise.all(urls.map(function (u) { return u ? downscale(u) : Promise.resolve(''); }));
    }).then(function (urls) {
      var p = U.store.production();
      if (!p) return { added: 0, beats: [] };
      var start = (p.beats || []).length;
      var made = [];
      urls.forEach(function (url, i) {
        if (!url) return;
        made.push(beatFromImage(list[i].name, url, start + made.length));
      });
      if (!made.length) return { added: 0, beats: [] };
      U.store.update(function () { p.beats = (p.beats || []).concat(made); });
      /* Whether it actually persisted, so the caller can say so rather than
         reporting a success the next reload would contradict. */
      return { added: made.length, beats: made, stored: U.store.get().storage !== 'full' };
    });
  }

  /* v1 does not open .pptx or .pdf. Saying so is the feature: a half-working
     parser that silently drops the speaker notes is worse than a sentence. */
  function importDeck(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) { return DECK_RE.test(f.name || ''); });
    return {
      ok: false, files: list.length,
      reason: 'v1 还不能拆 .pptx / .pdf —— 先把每页导成图片（.png / .jpg）拖进来，一张一节。'
    };
  }

  function sortFiles(files) {
    var all = Array.prototype.slice.call(files || []);
    return {
      images: all.filter(function (f) { return (f.type && f.type.indexOf('image/') === 0) || IMAGE_RE.test(f.name || ''); }),
      decks: all.filter(function (f) { return DECK_RE.test(f.name || ''); })
    };
  }

  /* ---------- the AI round-trip ---------- */

  /* People paste the whole reply, fences and pleasantries included. Take the
     outermost braces and try again rather than making them tidy it up. */
  function parseLoose(text) {
    var raw = String(text == null ? '' : text).trim();
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { /* fall through */ }
    var fenced = /```(?:json)?\s*([\s\S]*?)```/i.exec(raw);
    if (fenced) { try { return JSON.parse(fenced[1]); } catch (e) { /* fall through */ } }
    var a = raw.indexOf('{'), b = raw.lastIndexOf('}');
    if (a >= 0 && b > a) { try { return JSON.parse(raw.slice(a, b + 1)); } catch (e) { /* fall through */ } }
    a = raw.indexOf('['); b = raw.lastIndexOf(']');
    if (a >= 0 && b > a) { try { return JSON.parse(raw.slice(a, b + 1)); } catch (e) { /* fall through */ } }
    return null;
  }

  var CN = ['零', '一', '两', '三', '四', '五', '六', '七', '八', '九', '十'];
  function cn(n) { return (n >= 0 && n <= 10) ? CN[n] : String(n); }

  /* Pure on purpose: everything the fill step can refuse to do, decided without
     a DOM. `beats` comes back normalised, so applyFill has nothing left to judge. */
  function validateFill(input, production) {
    var res = { ok: false, errors: [], notices: [], beats: [], total: 0 };
    function err(code, text) { res.errors.push({ code: code, text: text }); }
    function note(code, text) { res.notices.push({ code: code, text: text }); }

    var data = (typeof input === 'string') ? parseLoose(input) : input;
    if (!data || typeof data !== 'object') {
      err('parse', '这段读不出 JSON —— 把 AI 回复里从 { 到 } 的部分整段粘进来就行。');
      return res;
    }
    var incoming = Array.isArray(data) ? data : data.beats;
    if (!Array.isArray(incoming)) {
      err('shape', '里面没有 beats 数组 —— 顶层要么是 { "beats": [...] }，要么直接是一个数组。');
      return res;
    }

    var beats = (production && production.beats) || [];
    if (beats.length && incoming.length !== beats.length) {
      err('count', '节数对不上：这边有 ' + beats.length + ' 节，这份给了 ' + incoming.length + ' 节。');
    }

    /* Everything past this line is markup this session did not write. The
       stage renders leads and scripts as HTML, so it goes through the gate
       once, here, rather than at each of the dozen places that render it. */
    var rate = (production && production.rate) || U.DEFAULT_RATE;
    var target = Number(production && production.target) || 0;
    var noCue = [], noScript = [], guessed = [], sum = 0;

    res.beats = incoming.map(function (raw, i) {
      var b = raw || {};
      var mine = beats[i] || {};
      var tag = b.n ? String(b.n) : label(mine, i);
      var cue = Array.isArray(b.cue) ? b.cue.filter(function (c) { return c && (c.lead || (c.say && c.say.length)); }) : [];
      var script = U.safeHtml(typeof b.script === 'string' ? b.script : '');
      if (!cue.length) noCue.push(tag);
      if (!blockText(script).length) noScript.push(tag);

      var budget = Number(b.budget);
      if (!isFinite(budget) || budget <= 0) {
        budget = Math.round(U.estimate(script, rate));
        guessed.push(tag);
      }
      sum += budget;

      return {
        n: tag,
        title: b.title != null ? String(b.title) : (mine.title || ''),
        slideRef: b.slideRef != null ? String(b.slideRef) : (mine.slideRef || ''),
        budget: budget,
        importance: Number(b.importance) || mine.importance || 2,
        cue: cue.map(function (c) {
          return {
            flag: c.flag ? String(c.flag) : '',
            cols: Array.isArray(c.cols) ? c.cols.map(String) : [],
            lead: U.safeHtml(c.lead),
            say: (Array.isArray(c.say) ? c.say : (c.say ? [c.say] : [])).map(function (x) { return U.safeHtml(x); }),
            notes: Array.isArray(c.notes) ? c.notes.map(String) : []
          };
        }),
        script: script,
        notes: Array.isArray(b.notes) ? b.notes.map(String) : []
      };
    });

    if (noCue.length) err('cue', noCue.length + ' 节没有提词（' + noCue.join(' ') + '）—— 提词是上台唯一会看的东西，不能空。');
    if (noScript.length) err('script', noScript.length + ' 节没有讲稿（' + noScript.join(' ') + '）。');
    if (target && sum > target) {
      err('over', 'budget 加起来 ' + U.fmt(sum) + '，比场地时间 ' + U.fmt(target) + ' 长 ' + U.fmt(sum - target) +
        ' —— 挪预算不会让演讲变短，让它把 script 改短再来一次。');
    }
    if (guessed.length) {
      note('budget', guessed.length + ' 节没给 budget（' + guessed.join(' ') + '），已按 ' +
        (rate.en || U.DEFAULT_RATE.en) + ' 词/分 · ' + (rate.zh || U.DEFAULT_RATE.zh) + ' 字/分 估算补上。');
    }

    res.total = sum;
    res.ok = res.errors.length === 0;
    return res;
  }

  /* Fill the blanks and only the blanks. Anything already written is the
     speaker's own sentence and outranks anything a model produced. */
  function applyFill(result, production) {
    var p = production || U.store.production();
    var report = { filled: [], kept: [] };
    if (!p || !result || !result.ok) return report;
    var beats = p.beats || [];
    U.store.update(function () {
      result.beats.forEach(function (incoming, i) {
        var mine = beats[i];
        if (!mine) {
          beats.push(Object.assign({ id: 'b' + Date.now().toString(36) + '-' + i }, incoming));
          report.filled.push(incoming.n);
          return;
        }
        if (hasScript(mine)) { report.kept.push(label(mine, i)); return; }
        mine.title = incoming.title || mine.title;
        mine.slideRef = incoming.slideRef || mine.slideRef;
        mine.budget = incoming.budget;
        mine.importance = incoming.importance;
        mine.cue = incoming.cue;
        mine.script = incoming.script;
        mine.notes = incoming.notes.length ? incoming.notes : (mine.notes || []);
        report.filled.push(label(mine, i));
      });
      p.beats = beats;
    });
    return report;
  }

  return {
    exportHtml: exportHtml,
    exportText: exportText,
    plainText: plainText,
    print: print,
    printSheets: printSheets,
    downscale: downscale,
    strip: strip,
    importImages: importImages,
    importDeck: importDeck,
    sortFiles: sortFiles,
    validateFill: validateFill,
    applyFill: applyFill,
    parseLoose: parseLoose,
    blockText: blockText,
    hasScript: hasScript,
    hasCue: hasCue,
    download: download,
    cn: cn
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = U.io;

/* ==== js/99-boot.js ==== */
'use strict';
/* Mount the current view, remount only when the view changes so a screen can
   hold live DOM (a contenteditable, a running clock) across state updates. */
(function () {
  var mounted = null;

  function render() {
    var root = document.getElementById('app');
    if (!root) return;
    var name = U.store.get().ui.view;
    var def = U.views.get(name);
    if (!def) {
      /* Forget what was mounted, or coming back to this same view finds
         mounted === name and leaves the apology on screen. */
      mounted = null;
      U.clear(root).appendChild(U.el('div', { class: 'u-lbl', style: { padding: '24px' } }, '没有这个界面：' + name));
      return;
    }
    if (mounted !== name) {
      U.clear(root);
      mounted = name;
      def.mount(root);
    }
    if (def.update) def.update(U.store.get());
  }

  function boot() {
    /* An exported copy carries its production in the shell's script tag; it
       wins over anything in storage, because someone opening that file wants
       that talk, not whatever this browser last worked on. */
    var baked = null;
    try {
      var tag = document.getElementById('embedded-production');
      var raw = tag && tag.textContent.trim();
      if (raw && raw.charAt(0) === '{') baked = JSON.parse(raw);
    } catch (e) { /* a corrupt bake must not stop the app booting */ }
    U.store.load();
    if (baked) { U.store.put(baked); U.store.open(baked.id); }
    else if (!U.store.production() && U.sample) U.store.put(U.sample());
    U.store.applyBody();
    U.store.subscribe(render);
    document.addEventListener('keydown', function (e) { U.keys.handle(e); });
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
